[package]
name = "agent-orchestrator"
version = "0.6.0"
description = "Core library for the Agent Orchestrator — task scheduling, runner, and persistence"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "agent", "automation", "sdlc"]
categories = ["development-tools"]
license = "MIT"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
orchestrator-collab = { path = "../crates/orchestrator-collab", version = "0.6.0" }
orchestrator-config = { path = "../crates/orchestrator-config", version = "0.6.0" }
orchestrator-persistence = { path = "../crates/orchestrator-persistence", version = "0.6.0" }
orchestrator-security = { path = "../crates/orchestrator-security", version = "0.6.0" }
orchestrator-proto = { path = "../crates/proto", version = "0.6.0" }
orchestrator-runner = { path = "../crates/orchestrator-runner", version = "0.6.0" }
anyhow = "1.0"
arc-swap = "1.9"
aes-gcm-siv = "0.11"
base64 = "0.23"
cel-interpreter = "0.10.0"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.16"
glob = "0.3"
sha2 = "0.11"
rand = "0.8"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "json"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
walkdir = "2.5"
pathdiff = "0.2"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
test-harness = []

[dev-dependencies]
# FR-141: core holds no connection in production. What still names the driver
# is cfg(test) code asserting on rows core wrote, reached through test_support.
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
# FR-141: core's own tests open the database to assert on the rows core logic
# wrote. They build their fixtures from TestState and create_task_impl, which
# sit above this layer, so they cannot move into it. The feature is enabled
# here and nowhere else — a [dependencies] edge to it fails the API gate.
orchestrator-persistence = { path = "../crates/orchestrator-persistence", version = "0.6.0", features = ["test-support"] }
tempfile = "3.26.0"
# Used only to capture emitted tracing events at the daemon's default `info`
# filter, so the visibility FR-142 restored is asserted rather than assumed.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
