apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: streaming-parity-prompt
spec:
  prompt: >-
    Call mcp__orch__mark_done exactly once with a one-line summary, then finish.
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: streaming-typed
spec:
  capabilities: [streaming_typed]
  driver:
    provider: claude
    transport: cli
    options:
      model: haiku
      maxTurns: 4
      permissionMode: governed
      allowedTools:
        - mcp__orch__mark_done
---
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: parity-hello-legacy
spec:
  steps:
    - id: run
      type: hello_legacy
      required_capability: hello_legacy
      enabled: true
      repeatable: false
  loop:
    mode: once
---
