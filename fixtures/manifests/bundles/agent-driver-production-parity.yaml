apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: parity-streaming-typed
spec:
  max_parallel: 1
  steps:
    - id: signal
      type: streaming_typed
      scope: task
      required_capability: streaming_typed
      template: streaming-parity-prompt
      enabled: true
      repeatable: true
      behavior:
        driverRequirements:
          multiTurn: true
          toolHosting: stdio
          workspaceAccess: read
    - id: loop_guard
      type: loop_guard
      builtin: loop_guard
      is_guard: true
      enabled: true
  loop:
    mode: infinite
    max_cycles: 3
    stop_when_no_unresolved: false
    convergence_expr:
      - engine: cel
        when: "'mark_done' in tools_called"
        reason: "recorded legacy and typed driver contracts both converge on mark_done"
