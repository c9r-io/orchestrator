apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: session-control-mock
spec:
  root_path: "."
  qa_targets: [docs/qa]
  ticket_dir: docs/ticket
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: session-echo
spec:
  driver:
    provider: shell
    transport: cli
  capabilities: [session_echo]
  command: >-
    sh -c 'echo "$1"; while true; do if IFS= read -r line; then echo "mock:$line"; [ "$line" = quit ] && break; else sleep 0.05; fi; done' session "{prompt}"
---
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: session-control-mock
spec:
  steps:
    - id: interactive
      type: interactive
      required_capability: session_echo
      tty: true
  loop:
    mode: once
    max_cycles: 1
---
apiVersion: orchestrator.dev/v2
kind: RuntimePolicy
metadata:
  name: default
spec:
  runner:
    shell: /bin/bash
    shell_arg: -lc
    policy: allowlist
    executor: shell
    allowed_shells: [/bin/bash, /bin/sh, sh]
    allowed_shell_args: [-lc, -c]
  resume:
    auto: false
  session_read_enabled: true
  session_control_enabled: true
