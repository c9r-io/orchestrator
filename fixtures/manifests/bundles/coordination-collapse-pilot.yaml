# FR-118 coordination-collapse pilot — the half that still applies.
#
# The tool workflow retains only governance and delegates in-fence coordination to typed tools.
# The legacy half it was measured against lives in `coordination-legacy-baseline.yaml` and is
# never applied as setup: `behavior.captures` was removed by design (DD-137), and `apply` is
# all-or-nothing over a bundle, so leaving it here took the tool pilot down with it.
apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: coordination-pilot
spec:
  root_path: "."
  qa_targets: [docs/qa]
  ticket_dir: docs/ticket
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: tool-coordination-agent
spec:
  capabilities: [tool_coordination]
  driver:
    provider: claude
    transport: cli
    binary: fake-claude-coordination
    options:
      maxTurns: 4
      budgetCapUsd: 0.01
      permissionMode: governed
      allowedTools:
        - mcp__orch__run_tests
        - mcp__orch__scan_tickets
        - mcp__orch__mark_item
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: tool-coordination-pilot
spec:
  prompt: >-
    Run the workspace tests, inspect tickets, and mark the current item based on
    typed tool results. Do not communicate state through shell output variables.
---
# BEGIN TOOL COORDINATION
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: coordination-tools
spec:
  steps:
    - id: coordinate
      type: tool_coordination
      scope: item
      required_capability: tool_coordination
      template: tool-coordination-pilot
      enabled: true
      repeatable: false
      behavior:
        side_effect_class: workspace_only
        driverRequirements:
          multiTurn: true
          toolHosting: stdio
          workspaceAccess: write
  loop:
    mode: once
# END TOOL COORDINATION
