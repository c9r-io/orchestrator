# WP05 Layer 1-A: Store + Spawning (WP01 x WP02)
# Parent task writes to store, spawns child that reads from store.
---
# Steps write and read the store through the CLI (FR-156 form), so the runner
# must pass the daemon-discovery variables through to the step shell — the
# same policy the fr156 parity fixture declares.
apiVersion: orchestrator.dev/v2
kind: RuntimePolicy
metadata:
  name: default
spec:
  runner:
    shell: /bin/bash
    shell_arg: -lc
    policy: allowlist
    env_allowlist:
      - PATH
      - HOME
      - USER
      - LANG
      - TERM
      - ORCHESTRATORD_DATA_DIR
      - ORCHESTRATOR_CONTROL_PLANE_CONFIG
      - ORCHESTRATOR_SOCKET
  resume:
    auto: false
---
apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: wp05-ws
spec:
  root_path: "."
  qa_targets:
    - fixtures/wp05-qa
  ticket_dir: fixtures/ticket
  self_referential: false
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: wp05_mock_agent
spec:
  driver:
    provider: shell
    transport: cli
  capabilities:
    - plan
    - implement
    - loop_guard
  command: "echo '{\"confidence\":0.95,\"quality_score\":0.9,\"artifacts\":[]}'"
---
# Parent workflow: writes to store, spawns child
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: wp05-store-spawn-parent
spec:
  steps:
    - id: plan
      type: plan
      scope: task
      enabled: true
      repeatable: false
      # The store write happens from the step itself (FR-156 retired the
      # store_put post-action); the CLI resolves via the gate's PATH.
      command: "printf '%s' '{\"confidence\":0.95,\"quality_score\":0.9,\"artifacts\":[{\"kind\":\"analysis\",\"findings\":[{\"title\":\"parent-finding\",\"description\":\"optimize parser\",\"severity\":\"info\"}]}]}'; orchestrator store put context parent_finding '{\"title\":\"parent-finding\",\"description\":\"optimize parser\"}' --project {project_id}"
      behavior:
        post_actions:
          - type: spawn_task
            goal: "child-verify-store-read"
            workflow: wp05-store-spawn-child
    - id: loop_guard
      type: loop_guard
      enabled: true
      repeatable: true
      is_guard: true
      builtin: loop_guard
  loop:
    mode: fixed
    max_cycles: 1
    enabled: true
  safety:
    max_consecutive_failures: 3
    auto_rollback: false
    checkpoint_strategy: none
    max_spawned_tasks: 5
    max_spawn_depth: 3
---
# Child workflow: reads from store
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: wp05-store-spawn-child
spec:
  steps:
    - id: implement
      type: implement
      scope: task
      enabled: true
      repeatable: false
      # The store read happens from the step itself (FR-156 retired store_inputs);
      # reading before emitting proves the child observes the parent's write.
      command: "orchestrator store get context parent_finding --project {project_id} >/dev/null; printf '%s' '{\"confidence\":0.9,\"quality_score\":0.85,\"artifacts\":[]}'"
    - id: loop_guard
      type: loop_guard
      enabled: true
      repeatable: true
      is_guard: true
      builtin: loop_guard
  loop:
    mode: fixed
    max_cycles: 1
    enabled: true
  safety:
    max_consecutive_failures: 3
    auto_rollback: false
    checkpoint_strategy: none
