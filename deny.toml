[sources]
# Zero findings today: every `source` line in Cargo.lock is crates.io. This is a
# guard, not a repair, which makes its negative fixture the only evidence it
# works — see scripts/qa/test-dependency-policy.sh.
unknown-registry = "deny"
unknown-git = "deny"
