  { crate = "jni-sys@0.3.1", reason = "follows jni. Reached via jni 0.21.1, ndk 0.9.0, ndk-sys 0.6.0+11769913. Keeping jni-sys 0.4.1." },
  { crate = "phf@0.11.3", reason = "cron 0.16 and chrono-tz 0.10 each pin an older phf; both are leaf-level and neither exposes it. Reached via cron 0.16.0. Keeping phf 0.13.1." },
  { crate = "phf@0.12.1", reason = "cron 0.16 and chrono-tz 0.10 each pin an older phf; both are leaf-level and neither exposes it. Reached via chrono-tz 0.10.4. Keeping phf 0.13.1." },
  { crate = "phf_generator@0.11.3", reason = "follows phf_macros. Reached via phf_macros 0.11.3. Keeping phf_generator 0.13.1." },
  { crate = "phf_macros@0.11.3", reason = "follows phf. Reached via phf 0.11.3. Keeping phf_macros 0.13.1." },
  { crate = "phf_shared@0.11.3", reason = "follows phf. Reached via phf 0.11.3, phf_generator 0.11.3, phf_macros 0.11.3. Keeping phf_shared 0.13.1." },
  { crate = "phf_shared@0.12.1", reason = "follows phf. Reached via phf 0.12.1. Keeping phf_shared 0.13.1." },
  { crate = "png@0.17.16", reason = "Tauri's icon codegen path is on png 0.17; muda is on 0.18. Reached via ico 0.5.0, tauri-codegen 2.6.3. Keeping png 0.18.1." },
  { crate = "proc-macro-crate@1.3.1", reason = "three generations arrive together through gtk3-macros, glib-macros and zbus. Reached via gtk3-macros 0.18.2, num_enum_derive 0.7.6. Keeping proc-macro-crate 3.5.0." },
  { crate = "proc-macro-crate@2.0.2", reason = "three generations arrive together through gtk3-macros, glib-macros and zbus. Reached via glib-macros 0.18.5. Keeping proc-macro-crate 3.5.0." },
  { crate = "r-efi@5.3.0", reason = "follows getrandom; a UEFI target crate that no target we build for compiles. Reached via getrandom 0.3.4. Keeping r-efi 6.0.0." },
  { crate = "rand@0.9.5", reason = "tauri-plugin-notification is on rand 0.9; our four crates declare ^0.8, and cron -> phf_generator 0.11 pins 0.8 independently, so unifying ours removes nothing. Reached via tauri-plugin-notification 2.3.3. Keeping rand 0.8.7." },
  { crate = "rand_chacha@0.9.0", reason = "follows rand. Reached via rand 0.9.5. Keeping rand_chacha 0.3.1." },
  { crate = "rand_core@0.9.5", reason = "follows rand. Reached via rand 0.9.5, rand_chacha 0.9.0. Keeping rand_core 0.6.4." },
  { crate = "reqwest@0.13.4", reason = "Tauri 2.11 bundles reqwest 0.13; our four crates declare ^0.12. Reached via tauri 2.11.5. Keeping reqwest 0.12.28." },
  { crate = "serde_spanned@0.6.9", reason = "follows toml. Reached via toml 0.8.2, toml_edit 0.20.2. Keeping serde_spanned 1.1.1." },
  { crate = "sha2@0.10.9", reason = "Tauri's codegen and wry hash with sha2 0.10; our seven crates declare ^0.11. Reached via tauri-codegen 2.6.3, wry 0.55.1. Keeping sha2 0.11.0." },
  { crate = "syn@1.0.109", reason = "syn 2 is still the ecosystem default and is reached from 46 proc-macro crates; syn 1 arrives only through proc-macro-error, which is itself unmaintained (RUSTSEC-2024-0370). Reached via proc-macro-error 1.0.4. Keeping syn 3.0.3." },
