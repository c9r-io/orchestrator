# Dependency policy — what shape the dependency graph is allowed to have.
#
# `cargo audit` answers "is anything in here known-bad". This file answers the
# question nothing asked before: how many versions of a crate may coexist, under
# what licenses, from what registries. Enforced by the `cargo-deny` job in
# .github/workflows/security.yml; the policy is described in
# docs/design_doc/orchestrator/156-dependency-policy-gate.md.
#
# `advisories` is deliberately absent, from this file and from the CI
# invocation. cargo-deny and cargo-audit read the same RustSec database and
# neither subsumes the other — measured at FR-133, cargo-deny reported 17
# unmaintained advisories as errors and did not report RUSTSEC-2024-0429
# (glib, unsound) at all, which cargo-audit does. So the split is one tool per
# question: cargo-deny owns graph shape, cargo-audit owns the advisory database.
#
# Two ratchets, both enforced by the tool rather than by a baseline number in a
# second file:
#
#   * `--deny unmatched-skip` on the CI invocation — a `skip` entry whose
#     duplicate upstream has resolved stops matching, and the build fails until
#     the entry is deleted. The list cannot keep dead entries.
#   * `unused-allowed-license = "deny"` — the same for an `allow` entry or an
#     exception that no longer applies.
#
# A new duplicate is an error by construction, so the list cannot grow without
# somebody writing a reason. That is the whole mechanism; there is no ledger to
# drift.

[graph]
# No `targets` filter: the policy is evaluated over the graph Cargo.lock
# actually describes, which spans every platform. Narrowing it to the two we
# ship would hide the windows-* generations rather than decide about them.
all-features = true

[licenses]
# Every one of the 653 external packages declares a license; there are no
# unknowns to resolve. Nine expressions cover all of them, and
# `unused-allowed-license = "deny"` means this list cannot grow speculatively —
# an entry nothing uses fails the build.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # ICU. 18 crates, all under the Unicode licence rather than a dual MIT/Apache.
  "Unicode-3.0",
  # `notify`, our filesystem trigger backend — a public-domain dedication.
  "CC0-1.0",
  # `webpki-roots` / `webpki-root-certs`. A data licence for the Mozilla trust
  # store, not a code licence.
  "CDLA-Permissive-2.0",
  # Weak, file-level copyleft, and we modify none of the five files it covers:
  # cssparser, cssparser-macros, dtoa-short, option-ext, selectors. Four of the
  # five arrive through Tauri's webview stack. Distributing them unmodified
  # inside an MIT binary is what MPL-2.0 §3.3 permits.
  "MPL-2.0",
]

exceptions = [
  # The only dependency in the tree whose licence is not satisfiable from the
  # list above. Five other crates carry `Apache-2.0 WITH LLVM-exception` and
  # offer `OR MIT` alongside it; target-lexicon does not, so it needs naming.
  # The exception is narrower than adding the expression to `allow`, which would
  # silently cover the next crate to arrive with it.
  { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies inside this workspace carry no version requirement, which
# cargo-deny reads as a wildcard. They cannot resolve from a registry, so the
# supply-chain question `wildcards` exists to ask does not apply to them. A
# registry dependency written `foo = "*"` still fails.
allow-wildcard-paths = true

# ── Accepted duplicates ───────────────────────────────────────────────────────
#
# 48 crates resolve to more than one version; 70 extra copies are accepted here,
# each naming the dependency that introduces it and the version being kept.
#
# There is deliberately no `skip-tree`. One `skip-tree = [{ crate = "tauri" }]`
# would absorb 28 of these 48 in a single line — and would go on absorbing
# duplicates that do not exist yet, silently, forever. A blanket is the other
# failure mode of a hand-listed set: the list at least stops growing visibly.
#
# The shape of this list, measured rather than assumed: 28 of the 48 exist only
# because `orchestrator-gui` is in the workspace. `cargo deny check bans
# --exclude orchestrator-gui` reports 20, and ten of those twenty are the
# windows-* import libraries for targets we do not build. The daemon and CLI
# graph carries ten real ones: cpufeatures, crypto-common, getrandom, hashbrown,
# phf, phf_shared, r-efi, syn, thiserror, thiserror-impl.
#
# Not one of these is unifiable by us. Only base64, rand, reqwest and sha2 are
# declared by any workspace crate, and in all four cases the other version comes
# from upstream. `rand` looks like the exception and is not: cron 0.16 ->
# phf 0.11 -> phf_macros -> phf_generator 0.11.3 pins rand 0.8 independently of
# our four declarations, so raising ours across nine API-breaking call sites
# would remove zero duplicates.
skip = [
  { crate = "base64@0.21.7", reason = "Tauri 2's macOS bridge is a generation behind; every workspace crate declares ^0.22. Reached via swift-rs 1.0.7. Keeping base64 0.22.1." },
  { crate = "bitflags@1.3.2", reason = "the gtk-rs 0.18 / webkit2gtk generation Tauri 2 pins never moved off bitflags 1. Reached via javascriptcore-rs 1.1.2, png 0.17.16, webkit2gtk 2.0.2, webkit2gtk-sys 2.0.2. Keeping bitflags 2.13.1." },
  { crate = "block-buffer@0.10.4", reason = "follows digest; the RustCrypto 0.10 generation arrives through Tauri's sha2. Reached via digest 0.10.7. Keeping block-buffer 0.12.1." },
  { crate = "cpufeatures@0.2.17", reason = "the RustCrypto 0.10 generation (aes, polyval) still uses cpufeatures 0.2. Reached via aes 0.8.4, polyval 0.6.2, sha2 0.10.9. Keeping cpufeatures 0.3.0." },
  { crate = "crypto-common@0.1.7", reason = "the RustCrypto 0.10 generation (aead, cipher, digest) still uses crypto-common 0.1. Reached via aead 0.5.2, cipher 0.4.4, digest 0.10.7, universal-hash 0.5.1. Keeping crypto-common 0.2.2." },
  { crate = "digest@0.10.7", reason = "Tauri's codegen and wry hash with the RustCrypto 0.10 generation; our crates are on 0.11. Reached via sha2 0.10.9. Keeping digest 0.11.3." },
  { crate = "foldhash@0.2.0", reason = "one GUI-side crate is ahead of the hashbrown generation the rest of the graph uses. Reached via dom_query 0.27.0. Keeping foldhash 0.1.5." },
  { crate = "getrandom@0.2.17", reason = "three generations coexist across rand 0.8, tempfile/tauri and uuid; the ecosystem is mid-transition. Reached via rand_core 0.6.4, redox_users 0.5.2, ring 0.17.14. Keeping getrandom 0.4.3." },
  { crate = "getrandom@0.3.4", reason = "three generations coexist across rand 0.8, tempfile/tauri and uuid; the ecosystem is mid-transition. Reached via rand_core 0.9.5, tauri 2.11.5, tempfile 3.27.0. Keeping getrandom 0.4.3." },
  { crate = "hashbrown@0.12.3", reason = "four generations arrive through indexmap 1, hashlink, petgraph and indexmap 2. Reached via indexmap 1.9.3. Keeping hashbrown 0.17.1." },
  { crate = "hashbrown@0.14.5", reason = "four generations arrive through indexmap 1, hashlink, petgraph and indexmap 2. Reached via hashlink 0.9.1. Keeping hashbrown 0.17.1." },
  { crate = "hashbrown@0.15.5", reason = "four generations arrive through indexmap 1, hashlink, petgraph and indexmap 2. Reached via petgraph 0.8.3. Keeping hashbrown 0.17.1." },
  { crate = "heck@0.4.1", reason = "glib-macros 0.18 predates heck 0.5; it moves when gtk-rs does. Reached via glib-macros 0.18.5. Keeping heck 0.5.0." },
  { crate = "indexmap@1.9.3", reason = "schemars 0.8, reached only through the GUI, still uses indexmap 1. Reached via schemars 0.8.22. Keeping indexmap 2.14.0." },
