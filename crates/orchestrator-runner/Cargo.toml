[package]
name = "orchestrator-runner"
version = "0.3.1"
description = "Command runner, sandbox, output capture, and network allowlist"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "runner", "sandbox"]
categories = ["development-tools"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[dependencies]
orchestrator-config = { path = "../orchestrator-config", version = "0.3.1" }
anyhow = "1.0"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
serde_json = "1.0"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"

# Orchestrator-owned MCP tool server used by the streaming agent runner.
# Spawned by the agent CLI (via --mcp-config) to provide typed tools.
[[bin]]
name = "orch-mcp-tools"
path = "src/bin/orch_mcp_tools.rs"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "0.31", default-features = false, features = ["user"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.26.0"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
