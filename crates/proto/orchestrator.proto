message ProcessMetricsGetResponse {
  uint32 schema_version = 1;
  string metrics_json = 2;
}

message ProcessMetricRecordRequest {
  string project_id = 1;
  string metric_name = 2;
  map<string, string> dimensions = 3;
  double value = 4;
  string source_key = 5;
}

message ProcessMetricRecordResponse {
  bool inserted = 1;
  string recorded_at = 2;
}

message ProcessMetricsRebuildRequest {
  string project_id = 1;
}

message ProcessMetricsPruneRequest {
  uint32 retention_days = 1;
}

message ProcessMetricsMaintenanceResponse {
  uint64 affected_rows = 1;
  string message = 2;
}

// ─── Lightweight step execution ──────────────────────────────

message RunStepRequest {
  optional string project_id = 1;
  optional string workspace_id = 2;
  string template = 3;
  string agent_capability = 4;
  optional string execution_profile = 5;
  map<string, string> initial_vars = 6;
  repeated string target_files = 7;
  bool no_start = 8;
}

message RunStepResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}
