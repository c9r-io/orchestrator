syntax = "proto3";

package orchestrator;

// ─── Task lifecycle ───────────────────────────────────────────
service OrchestratorService {
  // Task lifecycle
  rpc TaskCreate(TaskCreateRequest)   returns (TaskCreateResponse);
  rpc TaskStart(TaskStartRequest)     returns (TaskStartResponse);
  rpc TaskPause(TaskPauseRequest)     returns (TaskPauseResponse);
  rpc TaskResume(TaskResumeRequest)   returns (TaskResumeResponse);
  rpc TaskDelete(TaskDeleteRequest)   returns (TaskDeleteResponse);
  rpc TaskDeleteBulk(TaskDeleteBulkRequest) returns (TaskDeleteBulkResponse);
  rpc TaskRetry(TaskRetryRequest)     returns (TaskRetryResponse);
  rpc TaskRecover(TaskRecoverRequest) returns (TaskRecoverResponse);

  // Task queries
  rpc TaskList(TaskListRequest)       returns (TaskListResponse);
  rpc TaskInfo(TaskInfoRequest)       returns (TaskInfoResponse);
  rpc TaskTimeline(TaskTimelineRequest) returns (TaskTimelineResponse);

  // Task streaming (server-streaming)
  rpc TaskLogs(TaskLogsRequest)       returns (stream TaskLogChunk);
  rpc TaskFollow(TaskFollowRequest)   returns (stream TaskLogLine);
  rpc TaskWatch(TaskWatchRequest)     returns (stream TaskWatchSnapshot);
  rpc TaskTimelineFollow(TaskTimelineFollowRequest) returns (stream TimelineDelta);

  // Cross-task human attention queue
  rpc AttentionList(AttentionListRequest) returns (AttentionListResponse);
  rpc AttentionGet(AttentionGetRequest) returns (AttentionItem);
  rpc AttentionClaim(AttentionClaimRequest) returns (AttentionItem);
  rpc AttentionSnooze(AttentionSnoozeRequest) returns (AttentionItem);
  rpc AttentionResolve(AttentionResolveRequest) returns (AttentionItem);
  rpc AttentionExecuteAction(AttentionExecuteActionRequest) returns (AttentionItem);
  rpc AttentionFollow(AttentionFollowRequest) returns (stream AttentionDelta);

  // Project-scoped canonical mutation audit query surface
  rpc ActionAuditList(ActionAuditListRequest) returns (ActionAuditListResponse);
  rpc ActionAuditGet(ActionAuditGetRequest) returns (ActionAuditRecord);

  // Provider-neutral external source events and process bindings
  rpc SourceEventList(SourceEventListRequest) returns (SourceEventListResponse);
  rpc SourceEventGet(SourceEventGetRequest) returns (SourceEvent);
  rpc SourceAutomationRouteGet(SourceAutomationRouteGetRequest) returns (SourceAutomationRoute);
  rpc SourceAutomationList(SourceAutomationListRequest) returns (SourceAutomationListResponse);
  rpc SourceAutomationGet(SourceAutomationGetRequest) returns (SourceAutomationDetail);
  rpc SourceAutomationWatch(SourceAutomationWatchRequest) returns (stream SourceAutomationDelta);
  rpc SourceAutomationSimulate(SourceAutomationSimulateRequest) returns (SourceAutomationSimulateResponse);
  rpc SourceAutomationReplay(SourceAutomationMutationRequest) returns (SourceAutomationRoute);
  rpc SourceAutomationIgnore(SourceAutomationMutationRequest) returns (SourceAutomationRoute);
  rpc SourceAutomationStatusGet(SourceAutomationStatusRequest) returns (SourceAutomationStatusResponse);
  rpc SourceAutomationCatalogGet(SourceAutomationCatalogRequest) returns (SourceAutomationCatalogResponse);
  rpc SourceEventIngest(SourceEventIngestRequest) returns (SourceEventIngestResponse);
  rpc SourceBindingList(SourceBindingListRequest) returns (SourceBindingListResponse);
  rpc SourceBind(SourceBindRequest) returns (SourceBinding);
  rpc SourceReplay(SourceReplayRequest) returns (SourceReplayResponse);
  rpc SourceTaskTemplatePreview(SourceTaskTemplatePreviewRequest) returns (SourceTaskTemplatePreviewResponse);
  rpc SourceTaskBindingSimulate(SourceTaskBindingSimulateRequest) returns (SourceTaskBindingSimulateResponse);
  rpc SourceTaskBindingSuspend(SourceTaskBindingMutationRequest) returns (SourceTaskBindingMutationResponse);
  rpc SourceTaskBindingResume(SourceTaskBindingMutationRequest) returns (SourceTaskBindingMutationResponse);
  rpc SourceConnectionList(SourceConnectionListRequest) returns (SourceConnectionListResponse);
  rpc SourceConnectionGet(SourceConnectionGetRequest) returns (SourceConnection);
  rpc SourceConnectionWatch(SourceConnectionWatchRequest) returns (stream SourceConnectionDelta);
  rpc SourceConnectionCatalogGet(SourceConnectionCatalogRequest) returns (SourceConnectionCatalogResponse);
  rpc SourceConnectionConnect(SourceConnectionConnectRequest) returns (SourceConnectionIntentResponse);
  rpc SourceConnectionIntentGet(SourceConnectionIntentGetRequest) returns (SourceConnectionIntentResponse);
  rpc SourceConnectionCancel(SourceConnectionIntentMutationRequest) returns (SourceConnectionIntentResponse);
  rpc SourceConnectionReauthorize(SourceConnectionMutationRequest) returns (SourceConnectionIntentResponse);
  rpc SourceConnectionDisconnect(SourceConnectionMutationRequest) returns (SourceConnection);
  rpc SourceConnectionTransfer(SourceConnectionTransferRequest) returns (SourceConnection);
  rpc SourceConnectionDedicatedPreview(SourceConnectionDedicatedPreviewRequest) returns (SourceConnectionDedicatedProvisioningResponse);
  rpc SourceConnectionDedicatedApprove(SourceConnectionDedicatedMutationRequest) returns (SourceConnectionDedicatedProvisioningResponse);
  rpc SourceConnectionDedicatedGet(SourceConnectionDedicatedGetRequest) returns (SourceConnectionDedicatedProvisioningResponse);
  rpc SourceConnectionDedicatedAbandon(SourceConnectionDedicatedMutationRequest) returns (SourceConnectionDedicatedProvisioningResponse);
  rpc SourceConnectionMigrateToShared(SourceConnectionMutationRequest) returns (SourceConnectionIntentResponse);
  rpc SourceConnectionDedicatedUpgradePreview(SourceConnectionDedicatedUpgradePreviewRequest) returns (SourceConnectionDedicatedLifecycleResponse);
  rpc SourceConnectionDedicatedUpgradeApply(SourceConnectionDedicatedUpgradeApplyRequest) returns (SourceConnectionDedicatedLifecycleResponse);
  rpc SourceConnectionDedicatedDelete(SourceConnectionDedicatedDeleteRequest) returns (SourceConnection);

  // Deterministic handoff and two-stage safe logical resume
  rpc HandoffGenerate(HandoffGenerateRequest) returns (HandoffSnapshotResponse);
  rpc HandoffGet(HandoffGetRequest) returns (HandoffSnapshotResponse);
  rpc ResumeBoundaryList(ResumeBoundaryListRequest) returns (ResumeBoundaryListResponse);
  rpc ResumePlan(ResumePlanRequest) returns (ResumePlanResponse);
  rpc ResumeExecute(ResumeExecuteRequest) returns (ResumeExecuteResponse);

  // Resource management
  rpc Apply(ApplyRequest)             returns (ApplyResponse);
  rpc Get(GetRequest)                 returns (GetResponse);
  rpc Describe(DescribeRequest)       returns (DescribeResponse);
  rpc Delete(DeleteRequest)           returns (DeleteResponse);

  // Store
  rpc StoreGet(StoreGetRequest)       returns (StoreGetResponse);
  rpc StorePut(StorePutRequest)       returns (StorePutResponse);
  rpc StoreDelete(StoreDeleteRequest) returns (StoreDeleteResponse);
  rpc StoreList(StoreListRequest)     returns (StoreListResponse);
  rpc StorePrune(StorePruneRequest)   returns (StorePruneResponse);

  // System
  rpc Ping(PingRequest)               returns (PingResponse);
  rpc Shutdown(ShutdownRequest)       returns (ShutdownResponse);
  rpc MaintenanceMode(MaintenanceModeRequest) returns (MaintenanceModeResponse);
  rpc ConfigDebug(ConfigDebugRequest) returns (ConfigDebugResponse);
  rpc WorkerStatus(WorkerStatusRequest) returns (WorkerStatusResponse);
  rpc Check(CheckRequest)             returns (CheckResponse);
  rpc Init(InitRequest)               returns (InitResponse);
  rpc DbStatus(DbStatusRequest)       returns (DbStatusResponse);
  rpc DbMigrationsList(DbMigrationsListRequest) returns (DbMigrationsListResponse);
  rpc DbVacuum(DbVacuumRequest)       returns (DbVacuumResponse);
  rpc DbLogCleanup(DbLogCleanupRequest) returns (DbLogCleanupResponse);
  rpc ManifestValidate(ManifestValidateRequest) returns (ManifestValidateResponse);
  rpc ManifestExport(ManifestExportRequest) returns (ManifestExportResponse);
  rpc TaskTrace(TaskTraceRequest)     returns (TaskTraceResponse);

  // Secret key lifecycle
  rpc SecretKeyStatus(SecretKeyStatusRequest)   returns (SecretKeyStatusResponse);
  rpc SecretKeyList(SecretKeyListRequest)       returns (SecretKeyListResponse);
  rpc SecretKeyRotate(SecretKeyRotateRequest)   returns (SecretKeyRotateResponse);
  rpc SecretKeyRevoke(SecretKeyRevokeRequest)   returns (SecretKeyRevokeResponse);
  rpc SecretKeyBootstrap(SecretKeyBootstrapRequest) returns (SecretKeyBootstrapResponse);
  rpc SecretKeyHistory(SecretKeyHistoryRequest) returns (SecretKeyHistoryResponse);

  // Agent lifecycle (drain/cordon)
  rpc AgentList(AgentListRequest)               returns (AgentListResponse);
  rpc AgentCordon(AgentCordonRequest)           returns (AgentCordonResponse);
  rpc AgentUncordon(AgentUncordonRequest)       returns (AgentUncordonResponse);
  rpc AgentDrain(AgentDrainRequest)             returns (AgentDrainResponse);

  // Interactive agent session control plane
  rpc AgentSessionList(AgentSessionListRequest) returns (AgentSessionListResponse);
  rpc AgentSessionGet(AgentSessionGetRequest) returns (AgentSessionGetResponse);
  rpc AgentSessionAttach(AgentSessionAttachRequest) returns (AgentSessionAttachResponse);
  rpc AgentSessionHeartbeat(AgentSessionHeartbeatRequest) returns (AgentSessionHeartbeatResponse);
  rpc AgentSessionDetach(AgentSessionDetachRequest) returns (AgentSessionDetachResponse);
  rpc AgentSessionSendInput(AgentSessionSendInputRequest) returns (AgentSessionSendInputResponse);
  rpc AgentSessionRead(AgentSessionReadRequest) returns (stream AgentSessionOutputChunk);
  rpc AgentSessionClose(AgentSessionCloseRequest) returns (AgentSessionCloseResponse);
  rpc AgentSessionResolvePid(AgentSessionResolvePidRequest) returns (AgentSessionResolvePidResponse);

  // Event lifecycle
  rpc EventCleanup(EventCleanupRequest)         returns (EventCleanupResponse);
  rpc EventStats(EventStatsRequest)             returns (EventStatsResponse);
  rpc TaskEvents(TaskEventsRequest)             returns (TaskEventsResponse);

  // Trigger lifecycle
  rpc TriggerSuspend(TriggerSuspendRequest)     returns (TriggerSuspendResponse);
  rpc TriggerResume(TriggerResumeRequest)       returns (TriggerResumeResponse);
  rpc TriggerFire(TriggerFireRequest)           returns (TriggerFireResponse);

  // QA observability
  rpc QaDoctor(QaDoctorRequest)                 returns (QaDoctorResponse);

  // Process Console operational metrics
  rpc ProcessMetricsGet(ProcessMetricsGetRequest) returns (ProcessMetricsGetResponse);
  rpc ProcessMetricRecord(ProcessMetricRecordRequest) returns (ProcessMetricRecordResponse);
  rpc ProcessMetricsRebuild(ProcessMetricsRebuildRequest) returns (ProcessMetricsMaintenanceResponse);
  rpc ProcessMetricsPrune(ProcessMetricsPruneRequest) returns (ProcessMetricsMaintenanceResponse);

  // Lightweight step execution
  rpc RunStep(RunStepRequest)                   returns (RunStepResponse);

}

// ─── Task messages ────────────────────────────────────────────

message TaskCreateRequest {
  optional string name = 1;
  optional string goal = 2;
  optional string project_id = 3;
  optional string workspace_id = 4;
  optional string workflow_id = 5;
  repeated string target_files = 6;
  bool no_start = 7;
  repeated string step_filter = 8;         // step IDs to execute (empty = all)
  map<string, string> initial_vars = 9;    // ad-hoc pipeline variable injection
}

message TaskCreateResponse {
  string task_id = 1;
  string status = 2;      // "created" | "enqueued"
  string message = 3;
}

message TaskStartRequest {
  optional string task_id = 1;
  bool latest = 2;
}

message TaskStartResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}

message TaskPauseRequest {
  string task_id = 1;
}

message TaskPauseResponse {
  string task_id = 1;
  string message = 2;
}

message TaskResumeRequest {
  string task_id = 1;
  bool reset_blocked = 2;
}

message TaskResumeResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}

message TaskDeleteRequest {
  string task_id = 1;
  bool force = 2;
}

message TaskDeleteResponse {
  string message = 1;
}

message TaskDeleteBulkRequest {
  repeated string task_ids = 1;
  bool force = 2;
  string status_filter = 3;
  string project_filter = 4;
}

message TaskDeleteBulkResponse {
  int32 deleted = 1;
  int32 failed = 2;
  repeated string errors = 3;
  string message = 4;
}

message TaskRetryRequest {
  string task_item_id = 1;
  bool force = 2;
}

message TaskRetryResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}

message TaskRecoverRequest {
  string task_id = 1;
}

message TaskRecoverResponse {
  string task_id = 1;
  uint64 recovered_items = 2;
  string message = 3;
}

message TaskListRequest {
  optional string status_filter = 1;
  optional string project_filter = 2;
}

message TaskListResponse {
  repeated TaskSummary tasks = 1;
}

message TaskSummary {
  string id = 1;
  string name = 2;
  string status = 3;
  optional string started_at = 4;
  optional string completed_at = 5;
  string goal = 6;
  string project_id = 7;
  string workspace_id = 8;
  string workflow_id = 9;
  repeated string target_files = 10;
  int64 total_items = 11;
  int64 finished_items = 12;
  int64 failed_items = 13;
  string created_at = 14;
  string updated_at = 15;
  optional string parent_task_id = 16;
  optional string spawn_reason = 17;
  int64 spawn_depth = 18;
}

message TaskInfoRequest {
  string task_id = 1;
}

message TaskInfoResponse {
  TaskSummary task = 1;
  repeated TaskItem items = 2;
  repeated CommandRun runs = 3;
  repeated Event events = 4;
  repeated TaskGraphDebugBundle graph_debug = 5;
  repeated AgentStatus agent_states = 6;
}

message TaskTimelineRequest {
  string task_id = 1;
  optional string cursor = 2;
  uint32 limit = 3;
  repeated string categories = 4;
}

message TaskTimelineResponse {
  repeated TimelineEntry entries = 1;
  optional string next_cursor = 2;
  bool has_more = 3;
  int64 snapshot_max_event_id = 4;
  uint32 projection_version = 5;
}

message TimelineActorRef {
  string actor_type = 1;
  string actor_id = 2;
}

message TimelineEvidenceRef {
  string kind = 1;
  string label = 2;
  optional string uri = 3;
  optional string content_type = 4;
  optional string digest = 5;
  bool redacted = 6;
}

message TimelineEntry {
  string id = 1;
  string task_id = 2;
  string occurred_at = 3;
  string category = 4;
  string title = 5;
  string summary = 6;
  optional string status = 7;
  optional TimelineActorRef actor = 8;
  optional string step_id = 9;
  optional string task_item_id = 10;
  optional string command_run_id = 11;
  optional string session_id = 12;
  optional string checkpoint_id = 13;
  optional string source_event_id = 14;
  repeated TimelineEvidenceRef evidence = 15;
  repeated int64 raw_event_ids = 16;
  uint32 projection_version = 17;
}

message TaskTimelineFollowRequest {
  string task_id = 1;
  int64 after_event_id = 2;
  repeated string categories = 3;
  uint64 interval_millis = 4;
}

message TimelineDelta {
  string kind = 1; // upsert | reset_required
  optional TimelineEntry entry = 2;
  int64 snapshot_max_event_id = 3;
}

message AttentionActionDescriptor {
  string id = 1;
  string label = 2;
  string required_role = 3;
  string confirmation = 4;
  string input_schema_json = 5;
}

message AttentionItem {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  optional string task_item_id = 4;
  optional string step_id = 5;
  optional string session_id = 6;
  string kind = 7;
  string severity = 8;
  string state = 9;
  string title = 10;
  string summary = 11;
  optional string requested_decision_json = 12;
  repeated AttentionActionDescriptor actions = 13;
  optional string assignee = 14;
  string source_event_id = 15;
  int64 occurrence_count = 16;
  int64 reopen_count = 17;
  int64 version = 18;
  string created_at = 19;
  string updated_at = 20;
  string last_occurred_at = 21;
  optional string snoozed_until = 22;
  optional string sla_deadline = 23;
  optional string resolved_at = 24;
  optional string resolution_json = 25;
  optional string source_route_id = 26;
  optional string source_binding_name = 27;
}

message AttentionListRequest {
  optional string project_id = 1;
  optional string state = 2;
  optional string kind = 3;
  optional string severity = 4;
  optional string assignee = 5;
  optional string task_id = 6;
  uint32 limit = 7;
  bool active_only = 8;
}

message AttentionListResponse {
  repeated AttentionItem items = 1;
  int64 latest_change_id = 2;
}

message AttentionGetRequest { string id = 1; }

message AttentionClaimRequest {
  string id = 1;
  int64 expected_version = 2;
  string idempotency_key = 3;
  optional ActionAuditContext audit = 4;
}

message AttentionSnoozeRequest {
  string id = 1;
  int64 expected_version = 2;
  string idempotency_key = 3;
  string until = 4;
  optional ActionAuditContext audit = 5;
}

message AttentionResolveRequest {
  string id = 1;
  int64 expected_version = 2;
  string idempotency_key = 3;
  string reason = 4;
  optional ActionAuditContext audit = 5;
}

message AttentionExecuteActionRequest {
  string id = 1;
  int64 expected_version = 2;
  string idempotency_key = 3;
  string action_id = 4;
  string input_json = 5;
  optional ActionAuditContext audit = 6;
}

message ActionAuditContext {
  string reason_code = 1;
  optional string operator_reason = 2;
  optional string idempotency_key = 3;
}

message ActionAuditRecord {
  string request_id = 1;
  int64 schema_version = 2;
  string project_id = 3;
  optional string actor = 4;
  optional string resolved_role = 5;
  string transport = 6;
  string target_type = 7;
  string target_id = 8;
  string action = 9;
  string reason_code = 10;
  optional string operator_reason = 11;
  optional string idempotency_key = 12;
  optional string expected_version = 13;
  optional int64 fencing_token = 14;
  string request_hash = 15;
  string status = 16;
  optional string error_code = 17;
  optional string result_type = 18;
  optional string result_id = 19;
  string created_at = 20;
  string updated_at = 21;
  optional string completed_at = 22;
}

message ActionAuditListRequest {
  string project_id = 1;
  optional string actor = 2;
  optional string target_type = 3;
  optional string target_id = 4;
  optional string action = 5;
  optional string status = 6;
  optional string from_time = 7;
  optional string to_time = 8;
  uint32 limit = 9;
}

message ActionAuditListResponse { repeated ActionAuditRecord records = 1; }
message ActionAuditGetRequest { string project_id = 1; string request_id = 2; }

message AttentionFollowRequest {
  int64 after_change_id = 1;
  optional string project_id = 2;
  uint64 interval_millis = 3;
  optional string state = 4;
  optional string kind = 5;
  optional string severity = 6;
  optional string assignee = 7;
  optional string task_id = 8;
  bool active_only = 9;
}

message AttentionNotificationDescriptor {
  string dedupe_key = 1;
  string attention_item_id = 2;
  int64 item_version = 3;
  string title = 4;
  string severity = 5;
  string process_id = 6;
  string deep_link = 7;
}

message AttentionDelta {
  string kind = 1;
  int64 change_id = 2;
  optional AttentionItem item = 3;
  optional AttentionNotificationDescriptor notification = 4;
}

message SourceEvent {
  string id = 1;
  string project_id = 2;
  string provider = 3;
  string installation_id = 4;
  string external_event_id = 5;
  string event_type = 6;
  optional string external_actor_id = 7;
  optional string conversation_id = 8;
  optional string thread_id = 9;
  string occurred_at = 10;
  string received_at = 11;
  string normalized_json = 12;
  string payload_hash = 13;
  string routing_state = 14;
  int64 routing_attempts = 15;
  optional string routed_task_id = 16;
  optional string last_error_code = 17;
  optional string automation_route_id = 18;
  optional string automation_status = 19;
  optional string automation_binding_name = 20;
  optional string automation_template_name = 21;
  optional string automation_template_hash = 22;
}

message SourceEventListRequest {
  optional string project_id = 1;
  optional string task_id = 2;
  optional string routing_state = 3;
  uint32 limit = 4;
}

message SourceEventListResponse { repeated SourceEvent events = 1; }
message SourceEventGetRequest { string id = 1; }

message SourceAutomationRouteGetRequest { string source_event_id = 1; }

message SourceAutomationRoute {
  string id = 1;
  string project_id = 2;
  string source_event_id = 3;
  string provider = 4;
  string reaction = 5;
  string binding_name = 6;
  string binding_revision = 7;
  string template_name = 8;
  string template_hash = 9;
  string status = 10;
  optional string error_code = 11;
  optional string task_id = 12;
  optional string permalink = 13;
  string request_id = 14;
  string created_at = 15;
  optional string completed_at = 16;
  optional string error_category = 17;
  int64 generation = 18;
  int64 version = 19;
  int64 attempt_count = 20;
  int64 max_attempts = 21;
  optional string next_attempt_at = 22;
  optional string lease_expires_at = 23;
  optional string suspended_scope = 24;
  optional string last_attempt_at = 25;
  string updated_at = 26;
}

message SourceAutomationListRequest {
  optional string project_id = 1;
  optional string state = 2;
  optional string provider = 3;
  optional string binding_name = 4;
  optional string task_id = 5;
  uint32 page_size = 6;
  optional string page_token = 7;
}

message SourceAutomationListResponse {
  repeated SourceAutomationRoute routes = 1;
  optional string next_page_token = 2;
}

message SourceAutomationGetRequest {
  string route_id = 1;
  uint32 attempt_limit = 2;
}

message SourceAutomationRouteAttempt {
  int64 id = 1;
  string route_id = 2;
  int64 generation = 3;
  int64 attempt_no = 4;
  string started_at = 5;
  optional string completed_at = 6;
  optional string result_state = 7;
  optional string error_code = 8;
  optional string error_category = 9;
  optional int64 retry_after_seconds = 10;
}

message SourceAutomationDetail {
  SourceAutomationRoute route = 1;
  repeated SourceAutomationRouteAttempt attempts = 2;
}

message SourceAutomationWatchRequest {
  optional string project_id = 1;
  int64 after_cursor = 2;
  uint32 interval_millis = 3;
}

message SourceAutomationDelta {
  int64 cursor = 1;
  int64 route_version = 2;
  string state = 3;
  optional string error_code = 4;
  SourceAutomationRoute route = 5;
  string changed_at = 6;
}

message SourceAutomationSimulateRequest {
  string project_id = 1;
  string provider = 2;
  string installation_id = 3;
  string event_kind = 4;
  string reaction = 5;
  string target_kind = 6;
  string channel_id = 7;
  string external_actor_id = 8;
  string message_url = 9;
  optional string event_id = 10;
  string target_id = 11;
  // Optional unsaved SourceTaskBinding manifest overlaid only for this simulation.
  optional string draft_binding_content = 12;
}

message SourceAutomationSimulateResponse {
  SourceTaskBindingSimulateResponse match_result = 1;
  optional SourceTaskTemplatePreviewResponse rendered = 2;
  bool mutation_performed = 3;
  bool network_performed = 4;
}

message SourceAutomationMutationRequest {
  string route_id = 1;
  int64 expected_version = 2;
  string reason = 3;
  string idempotency_key = 4;
  bool adopt_current_config = 5;
}

message SourceAutomationFailureCount {
  string category = 1;
  uint64 count = 2;
}

message SourceAutomationStatusRequest { string project_id = 1; }

message SourceAutomationStatusResponse {
  string project_id = 1;
  uint64 backlog_count = 2;
  uint64 oldest_age_seconds = 3;
  uint64 active_leases = 4;
  uint64 retrying_count = 5;
  uint64 needs_attention_count = 6;
  repeated SourceAutomationFailureCount failure_categories = 7;
}

message SourceAutomationCatalogRequest { string project_id = 1; }

message SourceAutomationTemplateResource {
  string name = 1;
  string revision = 2;
  string skill_name = 3;
  string skill_invocation = 4;
  repeated string skill_args = 5;
  string workflow = 6;
  string workspace = 7;
  bool start = 8;
  map<string, string> initial_vars = 9;
  string goal_template = 10;
  repeated string allowed_variables = 11;
}

message SourceAutomationBindingResource {
  string name = 1;
  string revision = 2;
  string trigger_ref = 3;
  string installation_id = 4;
  string reaction = 5;
  repeated string channels = 6;
  bool all_channels = 7;
  string template_ref = 8;
  repeated string allowed_actor_roles = 9;
  bool suspended = 10;
}

message SourceAutomationInstallationResource {
  string trigger_name = 1;
  string installation_id = 2;
  repeated string actor_ids = 3;
  repeated string actor_roles = 4;
  bool suspended = 5;
  string reaction_routing = 6;
}

message SourceAutomationCatalogResponse {
  string project_id = 1;
  repeated SourceAutomationTemplateResource templates = 2;
  repeated SourceAutomationBindingResource bindings = 3;
  repeated SourceAutomationInstallationResource installations = 4;
  repeated string workflows = 5;
  repeated string workspaces = 6;
}

message SourceEventIngestRequest {
  string project_id = 1;
  string normalized_json = 2;
  string payload_hash = 3;
  optional ActionAuditContext audit = 4;
}

message SourceEventIngestResponse {
  SourceEvent event = 1;
  bool inserted = 2;
}

message SourceBinding {
  string id = 1;
  string project_id = 2;
  string task_id = 3;
  string provider = 4;
  string installation_id = 5;
  optional string conversation_id = 6;
  optional string thread_id = 7;
  string binding_type = 8;
  string created_by_event_id = 9;
  string created_at = 10;
}

message SourceBindingListRequest { string task_id = 1; }
message SourceBindingListResponse { repeated SourceBinding bindings = 1; }

message SourceBindRequest {
  string project_id = 1;
  string task_id = 2;
  string provider = 3;
  string installation_id = 4;
  optional string conversation_id = 5;
  optional string thread_id = 6;
  string binding_type = 7;
  string created_by_event_id = 8;
  optional ActionAuditContext audit = 9;
}

message SourceReplayRequest { string id = 1; optional ActionAuditContext audit = 2; }
message SourceReplayResponse { string id = 1; string status = 2; }

message SourceTaskTemplatePreviewRequest {
  string name = 1;
  string project_id = 2;
  string provider = 3;
  string installation_id = 4;
  string message_url = 5;
  optional string event_id = 6;
  optional string reaction = 7;
  optional string target_id = 8;
  // Optional unsaved SourceTaskTemplate manifest overlaid only for this preview.
  optional string draft_content = 9;
}

message SourceTaskTemplatePreviewResponse {
  string name = 1;
  string project_id = 2;
  string skill_name = 3;
  string skill_invocation = 4;
  repeated string skill_args = 5;
  string goal = 6;
