[package]
name = "orchestratord"
version = "0.6.0"
description = "Daemon process for the Agent Orchestrator — gRPC control plane and task execution"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "daemon", "grpc", "agent"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
rust-version.workspace = true
license = "MIT"
readme = "README.md"

[[bin]]
name = "orchestratord"
path = "src/main.rs"

[dependencies]
agent-orchestrator = { path = "../../core", version = "0.6.0" }
orchestrator-scheduler = { path = "../orchestrator-scheduler", version = "0.6.0" }
orchestrator-client = { path = "../orchestrator-client", version = "0.6.0" }
orchestrator-proto = { path = "../proto", version = "0.6.0" }
orchestrator-slack-gateway = { path = "../slack-gateway", version = "0.6.0" }
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
pem = "3.0"
prost = "0.14"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "ansi", "env-filter", "json"] }
x509-parser = "0.18"
serde_json = "1.0"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
http = "1"
http-body = "1"
pin-project-lite = "0.2"
tower = "0.5"
axum = "0.8"
hmac = "0.13"
hex = "0.4"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-full = "0.7"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2.5"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "fs"] }

[features]
dev-insecure = []

[dev-dependencies]
# FR-141: the cfg(test) modules in source_router.rs read the database back to
# assert on what the gRPC handlers wrote. They reach it through test_support,
# which is why this crate no longer names the driver at all — not under
# [dependencies], not under [dev-dependencies].
orchestrator-persistence = { path = "../orchestrator-persistence", version = "0.6.0", features = ["test-support"] }
tempfile = "3.10"
agent-orchestrator = { path = "../../core", features = ["test-harness"] }
