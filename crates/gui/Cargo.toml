[package]
name = "orchestrator-gui"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[features]
# Production Tauri builds must load the embedded frontend instead of devUrl.
# The Tauri CLI enables this feature automatically; repository cargo-based
# release and certification commands enable it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
orchestrator-client = { path = "../orchestrator-client", version = "0.4.0" }
orchestrator-proto = { path = "../proto", version = "0.4.0" }
tauri = { version = "2", features = ["rustls-tls"] }
tauri-plugin-notification = "2"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "sync", "signal"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
orchestrator-integration-tests = { path = "../integration-tests" }

[lib]
name = "orchestrator_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "orchestrator-gui"
path = "src/main.rs"
