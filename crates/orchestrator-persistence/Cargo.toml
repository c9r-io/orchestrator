[package]
name = "orchestrator-persistence"
version = "0.3.1"
description = "SQLite persistence layer for the Agent Orchestrator — migration chain, connections, and repositories"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "agent", "persistence", "sqlite"]
categories = ["development-tools"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[dependencies]
orchestrator-collab = { path = "../orchestrator-collab", version = "0.3.1" }
orchestrator-config = { path = "../orchestrator-config", version = "0.3.1" }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-rusqlite = "0.5"
uuid = { version = "1.11", features = ["serde", "v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.26.0"
