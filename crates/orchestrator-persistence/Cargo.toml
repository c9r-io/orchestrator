[package]
name = "orchestrator-persistence"
version = "0.5.0"
description = "SQLite persistence layer for the Agent Orchestrator — migration chain, connections, and repositories"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "agent", "persistence", "sqlite"]
categories = ["development-tools"]
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[dependencies]
orchestrator-collab = { path = "../orchestrator-collab", version = "0.5.0" }
orchestrator-config = { path = "../orchestrator-config", version = "0.5.0" }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-rusqlite = "0.5"
uuid = { version = "1.11", features = ["serde", "v4"] }
# Used only by attention_store: the dedupe key of an attention item is a hash of
# its identity columns, computed where the row is written.
sha2 = "0.11"
tracing = "0.1"

# session_store classifies a session row by whether its PID is still live, so
# the row's meaning depends on a liveness check. Unix-gated to match core.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Exposes src/test_support.rs, the only public path to a driver connection.
# Consumers must enable it from [dev-dependencies] only; the API-boundary gate
# fails if any crate enables it from [dependencies].
test-support = []

[dev-dependencies]
# Self dev-dependency so tests/round_trip.rs — a separate crate, and therefore
# outside this crate's privacy boundary — can reach test_support.
orchestrator-persistence = { path = ".", features = ["test-support"] }
tempfile = "3.26.0"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread"] }
