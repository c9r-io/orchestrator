[package]
name = "orchestrator-scheduler"
version = "0.6.0"
description = "Task scheduler engine for the Agent Orchestrator"
repository = "https://github.com/c9r-io/orchestrator"
keywords = ["orchestrator", "scheduler", "agent"]
categories = ["development-tools"]
license = "MIT"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent-orchestrator = { path = "../../core", version = "0.6.0" }
orchestrator-config = { path = "../orchestrator-config", version = "0.6.0" }
orchestrator-proto = { path = "../proto", version = "0.6.0" }
async-trait = "0.1"
anyhow = "1.0"
axum = "0.8"
arc-swap = "1.9"
cel-interpreter = "0.10.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1.51", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.11", features = ["serde", "v4"] }
pathdiff = "0.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { version = "0.31", default-features = false, features = ["user"] }

[features]
test-harness = ["agent-orchestrator/test-harness"]

[dev-dependencies]
# FR-141: this crate's cfg(test) modules open the database to assert on what
# the scheduler wrote. The production code holds no connection — the driver
# below is a dev-dependency for the same reason.
orchestrator-persistence = { path = "../orchestrator-persistence", version = "0.6.0", features = ["test-support"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
agent-orchestrator = { path = "../../core", version = "0.6.0", features = ["test-harness"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.26.0"
