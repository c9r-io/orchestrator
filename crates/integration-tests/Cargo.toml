[package]
name = "orchestrator-integration-tests"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
agent-orchestrator = { path = "../../core", version = "0.5.0", features = ["test-harness"] }
orchestrator-scheduler = { path = "../orchestrator-scheduler", version = "0.5.0", features = ["test-harness"] }
orchestrator-proto = { path = "../proto", version = "0.5.0" }
tonic = "0.14"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-stream = "0.1"
futures = "0.3"
anyhow = "1.0"
serde_json = "1.0"

[dev-dependencies]
# FR-141: trigger_fire.rs asserts against the database directly, which is what
# makes it end-to-end evidence rather than a restatement of the layer's API.
orchestrator-persistence = { path = "../orchestrator-persistence", version = "0.5.0", features = ["test-support"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
