# QA Loop — tool-driven test, ticket, fix, and verification template.
#
# Usage:
#   orchestrator apply -f docs/workflow/qa-loop.yaml --project qa-loop
#   orchestrator task create --name "qa-run" --goal "Run QA cycle" --workflow qa_loop --project qa-loop
#
# One provider session owns local coordination. The manifest retains capability,
# sandbox, tool allowlist, and loop governance; typed daemon tools replace the
# legacy ticket_scan builtin and cross-step status plumbing.
apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: default
spec:
  root_path: "."
  qa_targets:
    - docs/qa
  ticket_dir: docs/ticket
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: qa_coordinate
spec:
  description: "Run QA and converge the current item through typed tools"
  prompt: >-
    Validate the current target for {goal}. Call mcp__orch__run_tests first.
    If tests fail, call mcp__orch__create_ticket, inspect and fix the failure,
    then call mcp__orch__run_tests again. Call mcp__orch__scan_tickets before
    finishing. Mark the item qa_passed only when tests pass and no active ticket
    remains; otherwise mark it unresolved. Do not communicate coordination
    state through stdout fields or files.
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: qa-coordinator
  description: "Tool-driven QA coordinator"
spec:
  capabilities:
    - qa_coordination
  driver:
    provider: claude
    transport: cli
    options:
      maxTurns: 10
      budgetCapUsd: 1.00
      permissionMode: governed
      allowedTools:
        - mcp__orch__run_tests
        - mcp__orch__create_ticket
        - mcp__orch__scan_tickets
        - mcp__orch__mark_item
---
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: qa_loop
spec:
  steps:
    - id: qa_coordinate
      type: qa
      scope: item
      required_capability: qa_coordination
      template: qa_coordinate
      enabled: true
      repeatable: false
      behavior:
        side_effect_class: workspace_only
        driverRequirements:
          multiTurn: true
          toolHosting: stdio
          workspaceAccess: write
  loop:
    mode: once
