# Plan-Execute — plan-then-implement iteration template.
#
# Usage:
#   orchestrator apply -f docs/workflow/plan-execute.yaml --project plan-exec
#   orchestrator task create --name "my-feature" --goal "Implement feature X" --workflow plan_execute --project plan-exec
#
# Demonstrates: StepTemplate prompts, daemon-private provider continuity, typed
# verification tools, and task-scoped execution without captured coordination.
apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: default
spec:
  root_path: "."
  qa_targets:
    - docs/qa
  ticket_dir: docs/ticket
---
# ── Step Templates ────────────────────────────────────────────────────
# Prompts are decoupled from agents. The agent's `command` injects
# the rendered prompt via the {prompt} placeholder.
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: plan
spec:
  description: "Create an implementation plan for the given goal"
  prompt: >-
    You are working on a project at {source_tree}.
    Your task: create a detailed implementation plan for: {goal}.

    Output a plan document with these sections:
    1. Files to Change — which files need modifications
    2. Approach — step-by-step implementation strategy
    3. Test Strategy — how to verify the changes

    Current diff: {diff}
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: implement
spec:
  description: "Implement changes according to the plan"
  prompt: >-
    You are working on a project at {source_tree}.
    Your task: implement the changes described in: {goal}.

    Continue from the plan retained in the private provider session and follow
    it precisely.
    Run tests after making changes to verify correctness.
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: verify
spec:
  description: "Verify implementation matches the plan"
  prompt: >-
    You are working on a project at {source_tree}.
    Review the changes made for: {goal}.

    1. Check that all planned changes were implemented
    2. Call mcp__orch__run_tests for the workspace
    3. Flag any deviations from the plan
    4. Call mcp__orch__mark_item with verified only after tests pass

    Current diff: {diff}
---
# ── Agents ────────────────────────────────────────────────────────────
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: planner
  description: "Planning agent — creates implementation plans"
spec:
  capabilities:
    - plan
  driver:
    provider: claude
    transport: cli
    options:
      maxTurns: 6
      budgetCapUsd: 0.50
      permissionMode: governed
      allowedTools:
        - mcp__orch__mark_item
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: coder
  description: "Coding agent — implements and verifies changes"
spec:
  capabilities:
    - implement
    - verify
  driver:
    provider: claude
    transport: cli
    options:
      maxTurns: 12
      budgetCapUsd: 2.00
      permissionMode: governed
      allowedTools:
        - mcp__orch__run_tests
        - mcp__orch__mark_item
---
# ── Workflow ──────────────────────────────────────────────────────────
---
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: plan_execute
spec:
  max_parallel: 1
  steps:
    # Step 1 (task-scope): Generate the plan
    - id: plan
      type: plan
      scope: task
      required_capability: plan
      template: plan
      enabled: true
      repeatable: false
      behavior:
        driverRequirements:
          workspaceAccess: write
    # Step 2 (task-scope): Implement the plan
    - id: implement
      type: implement
      scope: task
      required_capability: implement
      template: implement
      enabled: true
      repeatable: false
      behavior:
        side_effect_class: workspace_only
        driverRequirements:
          sessionResume: true
          workspaceAccess: write
    # Step 3 (task-scope): Verify the result
    - id: verify
      type: verify
      scope: task
      required_capability: verify
      template: verify
      enabled: true
      repeatable: false
      behavior:
        side_effect_class: workspace_only
        driverRequirements:
          multiTurn: true
          toolHosting: stdio
          sessionResume: true
          workspaceAccess: write
  loop:
    mode: once
