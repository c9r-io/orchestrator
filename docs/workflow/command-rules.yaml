# Driver Session Continuity — typed session reuse and isolation template.
#
# Usage:
#   orchestrator apply -f docs/workflow/command-rules.yaml --project cmd-rules
#   orchestrator task create --name "session-demo" --goal "Demonstrate session reuse" --workflow command_rules --project cmd-rules
#
# This supersedes the legacy command_rules + captured session-ID pattern.
# Provider session references stay opaque inside the daemon and a step opts in
# through behavior.driverRequirements.sessionResume.
#
# Scenario:
#   1. create_session: starts provider context without exporting its identifier
#   2. plan:           explicitly resumes the private provider context
#   3. implement:      resumes again and builds on the plan
#   4. qa_testing:     omits sessionResume and therefore starts fresh
apiVersion: orchestrator.dev/v2
kind: Workspace
metadata:
  name: default
spec:
  root_path: "."
  qa_targets:
    - docs/qa
  ticket_dir: docs/ticket
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: create_session
spec:
  description: "Create private provider context for the task"
  prompt: >-
    Initialize analysis context for: {goal}.
    Keep the context inside this provider session and do not print or expose
    any provider session identifier.
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: plan
spec:
  description: "Create implementation plan using private session context"
  prompt: >-
    You are working on a project at {source_tree}.
    Create an implementation plan for: {goal}.
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: implement
spec:
  description: "Implement changes using the resumed provider context"
  prompt: >-
    Implement the changes for: {goal}.
    Follow the plan retained in this private provider session.
---
apiVersion: orchestrator.dev/v2
kind: StepTemplate
metadata:
  name: qa_review
spec:
  description: "Independent QA review in a fresh provider session"
  prompt: >-
    Independently review the project at {source_tree} for: {goal}.
    Perform QA verification without relying on prior session context.
---
apiVersion: orchestrator.dev/v2
kind: Agent
metadata:
  name: session-agent
  description: "Agent with daemon-private provider session continuity"
spec:
  capabilities:
    - create_session
    - plan
    - implement
    - qa_review
  driver:
    provider: claude
    transport: cli
    options:
      maxTurns: 6
      budgetCapUsd: 0.50
      permissionMode: governed
      allowedTools:
        - mcp__orch__mark_item
---
# No provider session ID enters captures, pipeline variables, manifests, logs,
# public DTOs, or events.
apiVersion: orchestrator.dev/v2
kind: Workflow
metadata:
  name: command_rules
spec:
  max_parallel: 1
  steps:
    - id: create_session
      type: plan
      scope: task
      required_capability: create_session
      template: create_session
      enabled: true
      repeatable: false
      behavior:
        driverRequirements:
          workspaceAccess: write
    - id: plan
      type: plan
      scope: task
      required_capability: plan
      template: plan
      enabled: true
      repeatable: false
      behavior:
        driverRequirements:
          sessionResume: true
          workspaceAccess: write
    - id: implement
      type: implement
      scope: task
      required_capability: implement
      template: implement
      enabled: true
      repeatable: false
      behavior:
        driverRequirements:
          sessionResume: true
          workspaceAccess: write
    - id: qa_testing
      type: qa_review
      scope: task
      required_capability: qa_review
      template: qa_review
      enabled: true
      repeatable: false
      behavior:
        driverRequirements:
          workspaceAccess: write
  loop:
    mode: once
