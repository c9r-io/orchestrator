name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-audit

      # Both `--deny` flags are load-bearing, not decoration. Without them this
      # step exits 0 over every informational advisory, which is how
      # RUSTSEC-2024-0429 sat unread in the tree and how 17 unmaintained
      # advisories rode along as unbooked debt until FR-153. Acceptances live
      # in .cargo/audit.toml, each with a reason and the condition that retires
      # it; the eighteenth unmaintained advisory fails here until booked.
      # scripts/qa/dependency-policy.rb asserts both flags are still here.
      - name: Audit dependencies
        run: cargo audit --deny unsound --deny unmaintained

  cargo-deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-deny

      # Blocking, with no continue-on-error: a dependency policy that cannot
      # fail the build is a document. The check list is exactly these three —
      # `advisories` belongs to the cargo-audit job above, and listing it here
      # (or writing `all`) would double-report the same database while still
      # missing the unsound class cargo-deny does not surface. `--deny
      # unmatched-skip` is half the ratchet: an acceptance whose crate@version
      # has left the graph fails until its deny.toml entry is deleted. The other
      # half — an acceptance whose crate is still present but no longer
      # duplicated — is skip-is-live in scripts/qa/dependency-policy.rb.
      - name: Check dependency policy
        run: cargo deny --workspace --all-features check --deny unmatched-skip bans licenses sources

      # The half of the negative fixtures that needs the binary, so it runs
      # where the binary is. "The flag is present in the YAML" and "the ratchet
      # ratchets" are different claims, and only the second one is worth
      # trusting; the first is checked in ci.yml, which has no cargo-deny.
      - name: Dependency policy fixtures against the real tool
        run: ./scripts/qa/test-dependency-policy.sh --tool-fixtures
