name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  async-lock-governance:
    name: Async lock governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify async lock governance
        run: ./scripts/check-async-lock-governance.sh

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # orchestrator-gui compiles against webkit2gtk/gtk via pkg-config on
      # Linux, and `tauri::generate_context!` reads `frontendDist:
      # ../../gui/dist` at compile time — the same two prerequisites the
      # boundary-coverage job satisfies (there via macOS system frameworks).
      # Both are needed before any workspace-wide cargo command that no longer
      # excludes the crate (FR-076 requirement 1).
      - name: Install GUI system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build the frontend bundle the Tauri crate compiles against
        working-directory: gui
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PROTOC: /usr/bin/protoc

  test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Same GUI prerequisites as the clippy job; see the comment there.
      - name: Install GUI system dependencies
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build the frontend bundle the Tauri crate compiles against
        working-directory: gui
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace
        env:
          PROTOC: /usr/bin/protoc

  coordination-strangler:
    name: Coordination strangler governance and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ripgrep is not in either runner image. Without it this job's gate exited
      # on its own `command -v` preamble, having asserted nothing, on every push
      # since it was wired — while the surface gate certified it as enforced.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coordination-strangler

      # This job's gate is isolated by fixture pinning alone, which is the
      # mechanism FR-134 defect 3 defeated. The stubs are its second line.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      - name: Verify production inventory, ratchet, and per-workflow parity
        run: ./scripts/qa/test-coordination-strangler.sh
        env:
          PROTOC: /usr/bin/protoc

  governance:
    name: QA gate enforcement surface
    runs-on: ubuntu-latest
    steps:
      # Full history. test-agent-driver-production-parity.sh proves FR-126's
      # retirement evidence with `git cat-file`, `git merge-base` and a reverse
      # `git apply` of the removal patch — the parity record that has to hold
      # before a removal counts as closed. All three fail on the single commit
      # actions/checkout fetches by default, and all three pass on any developer
      # machine, so they had never once been verified in CI.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # test-docs-publishing-integrity.sh runs scripts/sync-docs.mjs to compare what
      # the generator produces against what the policy declares. Without Node the gate
      # exits on its own missing-command preamble rather than passing silently.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: governance

      # No ci-required gate may reach a real provider CLI. GitHub runners ship
      # neither binary today; these stubs turn a future accidental invocation
      # into a visible failure instead of silent credential and quota spend.
      # Extracted to a composite action so it is not one job's private
      # arrangement — coordination-strangler needs the same backstop.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      # Every step below reports independently. A serial job stops at its first
      # failure, so one red gate hides every diagnosis after it: FR-134's
      # workspace-scope defect sat invisible behind the ledger tooling's
      # self-lock for two runs. `continue-on-error` lets one run surface every
      # problem, and the aggregate step at the end is what fails the job.
      - name: Verify CI job liveness
        id: liveness
        continue-on-error: true
        run: ./scripts/qa/ci-liveness.rb

      - name: Verify CI job liveness negative fixtures
        id: liveness-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-ci-liveness.sh

      - name: Verify gate enforcement surface
        id: surface
        continue-on-error: true
        run: ./scripts/qa/test-qa-gate-surface.sh

      - name: Verify gate enforcement surface negative fixtures
        id: surface-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-qa-gate-surface.sh --fixture-test

      - name: Verify skill mirror integrity
        id: mirror
        continue-on-error: true
        run: ./scripts/qa/test-skill-mirror-integrity.sh

      - name: Verify skill mirror integrity negative fixtures
        id: mirror-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-skill-mirror-integrity.sh --fixture-test

      - name: Verify docs publishing integrity
        id: publishing
        continue-on-error: true
        run: ./scripts/qa/test-docs-publishing-integrity.sh

      - name: Verify docs publishing integrity negative fixtures
        id: publishing-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-docs-publishing-integrity.sh --fixture-test

      - name: Verify release publish surface
        id: release-surface
        continue-on-error: true
        run: ./scripts/qa/test-release-publish-surface.sh

      - name: Verify release publish surface negative fixtures
        id: release-surface-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-release-publish-surface.sh --fixture-test

      - name: Verify release tag liveness
        id: tag-liveness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/qa/test-release-tag-liveness.sh

      - name: Verify release tag liveness negative fixtures
        id: tag-liveness-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-release-tag-liveness.sh --fixture-test

      - name: Verify markdown link integrity
        id: links
        continue-on-error: true
        run: ./scripts/qa/test-markdown-link-integrity.sh

      - name: Verify markdown link integrity fixtures
        id: links-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-markdown-link-integrity.sh --fixture-test

      - name: QA documentation lint and Agent driver documentation alignment
        id: doc-lint
        continue-on-error: true
        run: ./scripts/qa-doc-lint.sh

      - name: QA doc lint workflow-ID scope negative fixtures
        id: doc-lint-scope
        continue-on-error: true
        run: ./scripts/qa/test-qa-doc-lint-workflow-scope.sh

      - name: Coordination governance inventory
        id: coordination
        continue-on-error: true
        run: ./scripts/qa/test-coordination-governance.sh

      - name: Governance ledger regeneration tooling
        id: ledger-tooling
        continue-on-error: true
        run: ./scripts/qa/test-governance-ledger-tooling.sh

      - name: Core crate boundary and schema snapshot
        id: core-boundary
        continue-on-error: true
        run: ./scripts/qa/test-core-boundary.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Persistence dependency chokepoint
        id: persistence-dependency
        continue-on-error: true
        run: ./scripts/qa/test-persistence-dependency.sh

      - name: Persistence API capability boundary
        id: persistence-api-boundary
        continue-on-error: true
        run: ./scripts/qa/test-persistence-api-boundary.sh

      - name: Persistence crate extraction contracts
        id: persistence-extraction
        continue-on-error: true
        run: ./scripts/qa/test-persistence-extraction.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Design doc and QA lifecycle metadata
        id: doc-lifecycle
        continue-on-error: true
        run: ./scripts/qa/test-doc-lifecycle.sh

      - name: CLI three-surface documentation parity
        id: cli-doc-parity
        continue-on-error: true
        run: ./scripts/qa/test-cli-doc-parity.sh

      - name: CLI documentation parity fixtures
        id: cli-doc-parity-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-cli-doc-parity.sh --fixture-test

      # The bash 3.2 scanner's lexical half. Its sibling on the
      # coverage-policy-fixtures job executes the constructs under a real 3.2;
      # this one asserts the scanner reads whole files, which is host-independent
      # and was silently false while that job was green.
      - name: bash 3.2 scanner lexical state
        id: bash32-lexer
        continue-on-error: true
        run: ./scripts/qa/test-bash32-lexer.sh

      - name: Governance execution cost and budget
        id: cost
        continue-on-error: true
        run: ./scripts/qa/ci-cost.rb

      - name: Governance execution cost negative fixtures
        id: cost-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-ci-cost.sh

      - name: JSON reads observe their exit status
        id: jq-status
        continue-on-error: true
        run: ./scripts/qa/jq-status-observed.rb

      - name: JSON read status negative fixtures
        id: jq-status-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-jq-status-observed.sh

      - name: Negative fixtures prove they applied a mutation
        id: fixture-drift
        continue-on-error: true
        run: ./scripts/qa/fixture-target-drift.rb

      - name: Fixture target drift negative fixtures
        id: fixture-drift-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-fixture-target-drift.sh

      # The policy itself is enforced by cargo-deny in security.yml. This asks
      # the other question — whether that invocation still carries the flags
      # that make it bind — and needs no cargo-deny binary to do it.
      - name: Dependency policy still binds
        id: dependency-policy
        continue-on-error: true
        run: ./scripts/qa/dependency-policy.rb

      - name: Dependency policy negative fixtures
        id: dependency-policy-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-dependency-policy.sh

      # `grep -q` leaves on the first match; under `set -o pipefail` a producer
      # still writing when it leaves dies of EPIPE and that becomes the
      # pipeline's answer. Scope is every tracked *.sh that enables pipefail —
      # a property read from each file, not this manifest, because two scripts
      # this workflow runs are not in it.
      - name: No short-circuiting reader under pipefail
        id: pipefail-short-circuit
        continue-on-error: true
        run: ./scripts/qa/pipefail-short-circuit.rb

      - name: Pipefail short-circuit negative fixtures
        id: pipefail-short-circuit-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-pipefail-short-circuit.sh

      - name: Legacy coordination decommission contracts
        id: decommission
        continue-on-error: true
        run: ./scripts/qa/test-legacy-coordination-decommission.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Recorded Codex session resume contracts
        id: codex-resume
        continue-on-error: true
        run: ./scripts/qa/test-codex-session-resume.sh
        env:
          PROTOC: /usr/bin/protoc

      # FR085_SKIP_WORKSPACE=1 defers the gate's workspace-wide test and clippy
      # commands to the sibling test and clippy jobs of this workflow. Since
      # FR-076 requirement 1 those jobs run a strict superset of the deferred
      # pair: the same -D warnings, without --exclude orchestrator-gui (this
      # job keeps the exclusion because it does not install the GUI's webkit
      # and frontend prerequisites). The certifying aggregate is the workflow —
      # the FR-126 FAST-mode shape.
      - name: Filesystem trigger contracts
        id: filesystem-trigger
        continue-on-error: true
        run: FR085_SKIP_WORKSPACE=1 ./scripts/qa/test-filesystem-trigger.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Agent driver production parity
        id: parity
        continue-on-error: true
        run: ./scripts/qa/test-agent-driver-production-parity.sh
        env:
          PROTOC: /usr/bin/protoc

      # FR126_FAST=1 skips the repository-wide gates (fmt, clippy, workspace tests,
      # coordination strangler, coverage fixtures, qa-doc-lint) that already run as
      # sibling jobs in this workflow, and the production parity harness that runs
      # as this job's own `parity` step above. The certifying aggregate is the
      # workflow.
      - name: Agent driver execution migration contracts
        id: execution-migration
        continue-on-error: true
        run: FR126_FAST=1 ./scripts/qa/test-agent-driver-execution-migration.sh
        env:
          PROTOC: /usr/bin/protoc

      # This is the step that fails the job. Every gate above records its real
      # outcome and keeps going, so one run reports every problem instead of
      # only the first — which is how FR-134's workspace-scope defect stayed
      # invisible behind the ledger tooling's self-lock across two runs.
      - name: Governance result
        if: always()
        shell: bash
        env:
          OUTCOMES: |
            liveness=${{ steps.liveness.outcome }}
            liveness-fixtures=${{ steps.liveness-fixtures.outcome }}
            surface=${{ steps.surface.outcome }}
            surface-fixtures=${{ steps.surface-fixtures.outcome }}
            mirror=${{ steps.mirror.outcome }}
            mirror-fixtures=${{ steps.mirror-fixtures.outcome }}
            publishing=${{ steps.publishing.outcome }}
            publishing-fixtures=${{ steps.publishing-fixtures.outcome }}
            release-surface=${{ steps.release-surface.outcome }}
            release-surface-fixtures=${{ steps.release-surface-fixtures.outcome }}
            tag-liveness=${{ steps.tag-liveness.outcome }}
            tag-liveness-fixtures=${{ steps.tag-liveness-fixtures.outcome }}
            links=${{ steps.links.outcome }}
            links-fixtures=${{ steps.links-fixtures.outcome }}
            doc-lint=${{ steps.doc-lint.outcome }}
            doc-lint-scope=${{ steps.doc-lint-scope.outcome }}
            coordination=${{ steps.coordination.outcome }}
            ledger-tooling=${{ steps.ledger-tooling.outcome }}
            core-boundary=${{ steps.core-boundary.outcome }}
            persistence-dependency=${{ steps.persistence-dependency.outcome }}
            persistence-api-boundary=${{ steps.persistence-api-boundary.outcome }}
            persistence-extraction=${{ steps.persistence-extraction.outcome }}
            doc-lifecycle=${{ steps.doc-lifecycle.outcome }}
            cli-doc-parity=${{ steps.cli-doc-parity.outcome }}
            cli-doc-parity-fixtures=${{ steps.cli-doc-parity-fixtures.outcome }}
            bash32-lexer=${{ steps.bash32-lexer.outcome }}
            cost=${{ steps.cost.outcome }}
            cost-fixtures=${{ steps.cost-fixtures.outcome }}
            jq-status=${{ steps.jq-status.outcome }}
            jq-status-fixtures=${{ steps.jq-status-fixtures.outcome }}
            fixture-drift=${{ steps.fixture-drift.outcome }}
            fixture-drift-fixtures=${{ steps.fixture-drift-fixtures.outcome }}
            dependency-policy=${{ steps.dependency-policy.outcome }}
            dependency-policy-fixtures=${{ steps.dependency-policy-fixtures.outcome }}
            pipefail-short-circuit=${{ steps.pipefail-short-circuit.outcome }}
            pipefail-short-circuit-fixtures=${{ steps.pipefail-short-circuit-fixtures.outcome }}
            decommission=${{ steps.decommission.outcome }}
            codex-resume=${{ steps.codex-resume.outcome }}
            filesystem-trigger=${{ steps.filesystem-trigger.outcome }}
            parity=${{ steps.parity.outcome }}
            execution-migration=${{ steps.execution-migration.outcome }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            gate="${line%%=*}"
            outcome="${line#*=}"
            printf '%-22s %s\n' "$gate" "$outcome"
            [[ "$outcome" == "success" || "$outcome" == "skipped" ]] || failed=1
          done <<< "$OUTCOMES"
          echo ""
          if [[ "$failed" -ne 0 ]]; then
            echo "one or more governance gates failed; each is reported above and in its own step" >&2
            exit 1
          fi
          echo "all governance gates passed"

  ci-environment-parity:
    name: CI environment parity
    runs-on: ubuntu-latest
    steps:
      # This job runs gates that are declared against other jobs, so it needs
      # what those gates need. ci-liveness.rb reads history; without it the
      # comparison still passes — both sides fail identically — but it would be
      # comparing two degraded runs and proving nothing about the real one.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      # Runs each in-scope gate twice, with and without the CI variables, so it
      # gets its own job rather than doubling the governance job's runtime.
      - name: Verify gates behave identically with and without CI set
        run: ./scripts/qa/test-ci-environment-parity.sh

      - name: Verify the comparison can fail
        run: ./scripts/qa/test-ci-environment-parity.sh --fixture-test

  coverage-policy-fixtures:
    name: Coverage policy fixtures and shell compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # macOS ships ruby at /usr/bin/ruby on every image, so only the Linux leg
      # needs this. Both gates below check for it themselves and exit with a
      # named diagnostic rather than a stack trace if it is ever absent.
      - name: Install ruby (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ruby

      # FR-147 classified coverage-governance.sh as ci-required/no-provider. On
      # this job it runs as --fixture-test, which execs a node script and touches
      # no Rust, so the claim is cheap to believe here — the stubs are installed
      # anyway because "believable" is not "observed", and the sibling
      # boundary-coverage job needs them for the full run.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      - name: Verify baseline, unsupported branch, and path fixtures
        run: ./scripts/coverage-governance.sh --fixture-test

      # These two belong on this job because it is the only fast one with a
      # macOS leg, and macOS is the only place bash 3.2 exists. The heavy
      # boundary-coverage job used to be the sole exercise of the shell main
      # path, so a defect on its first line took six runs and a manual read of
      # the logs to notice.
      - name: Verify bash 3.2 compatibility
        run: ./scripts/qa/test-bash32-compat.sh

      - name: Verify the coverage governance main path
        run: ./scripts/qa/test-coverage-governance-mainpath.sh

  slack-certification-recorded:
    name: Slack certification recorded contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both gates below require ripgrep, which neither runner image ships.
      # They had been exiting on their missing-command preamble on every push.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Verify checkpoint, redaction, cleanup, and recorded provider contracts
        run: ./scripts/qa/test-slack-live-certification.sh

      - name: Display latest reviewed live status without loading secrets
        run: ./scripts/qa/certify-slack-managed-live.sh status

  boundary-coverage:
    name: Boundary coverage non-regression
    runs-on: macos-latest
    needs:
      - coverage-policy-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: boundary-coverage

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5

      # coverage-governance.sh is declared no-provider, and this is the one
      # ci-required gate whose no-provider claim check_provider_isolation cannot
      # actually see: that branch greps the gate's own shell text for the fixture
      # bundles it names, while this run is `cargo llvm-cov --workspace
      # --all-targets --all-features` plus the npm and Playwright suites, whose
      # bundles are named in Rust and TS. The stubs are what makes the
      # declaration observable — a real claude/codex here exits 97 and says so,
      # instead of quietly spending credentials behind a green check.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install Playwright browser
        working-directory: gui
        run: npx playwright install chromium

      # `cargo llvm-cov --workspace` compiles orchestrator-gui, whose
      # `tauri::generate_context!` reads `frontendDist: ../../gui/dist` at
      # compile time and panics when that directory is absent. Nothing in this
      # job produced it, so the crate could not build here — a second blocker
      # that only became visible once the shell error on line 38 stopped
      # ending the step first.
      - name: Build the frontend bundle the Tauri crate compiles against
        working-directory: gui
        run: npm run build

      - name: Generate and enforce boundary coverage
        run: ./scripts/coverage-governance.sh

      # `always()` is kept so the artifacts survive a coverage regression, which
      # is when they are most worth reading. `if-no-files-found` is `warn` and
      # not `error` because the combination made this step the only ##[error] in
      # the summary whenever generation failed: the reader saw "no files were
      # found" and not the generation error one step above it. The generation
      # step fails the job on its own; this step has no failure to add.
      - name: Upload auditable coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boundary-coverage-${{ runner.os }}-${{ runner.arch }}
          path: target/coverage-governance/
          if-no-files-found: warn

  miri:
    name: Miri unsafe validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: Run Miri on core crate (resource_limits module)
        run: cargo +nightly miri test -p agent-orchestrator --lib -- runner::resource_limits
        env:
          PROTOC: /usr/bin/protoc
          MIRIFLAGS: "-Zmiri-disable-isolation"

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl is a portability proof, not a shipped target: it keeps
          # glibc-only code from landing, while release.yml deliberately does
          # not publish a musl artifact. The shipped set is asserted by
          # scripts/qa/test-release-publish-surface.sh against release.yml,
          # install.sh and the Homebrew formula; this entry is intentionally
          # outside that set (FR-150 decision, recorded in the CHANGELOG).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross-compile tooling (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compile tooling (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Detect protoc path
        id: protoc
        shell: bash
        run: echo "path=$(which protoc)" >> "$GITHUB_OUTPUT"

      # The GUI exclusion is deliberate here and only here (FR-076 requirement
      # 1 removed it from the clippy and test jobs). On the foreign-target legs
      # the gtk-rs sys crates cannot link: webkit2gtk/gtk dev packages exist
      # for the build host, not for a cross --target. On the two host-target
      # legs the crate would additionally need the npm-built gui/dist that
      # `tauri::generate_context!` reads, which this job does not produce.
      # Host-target GUI compilation is covered by the clippy/test jobs (Linux)
      # and boundary-coverage (macOS).
      - name: Cargo check
        run: cargo check --workspace --exclude orchestrator-gui --target ${{ matrix.target }}
        env:
          PROTOC: ${{ steps.protoc.outputs.path }}
