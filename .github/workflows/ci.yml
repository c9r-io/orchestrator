name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  async-lock-governance:
    name: Async lock governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify async lock governance
        run: ./scripts/check-async-lock-governance.sh

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude orchestrator-gui --all-targets -- -D warnings
        env:
          PROTOC: /usr/bin/protoc

  test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --exclude orchestrator-gui
        env:
          PROTOC: /usr/bin/protoc

  coordination-strangler:
    name: Coordination strangler governance and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ripgrep is not in either runner image. Without it this job's gate exited
      # on its own `command -v` preamble, having asserted nothing, on every push
      # since it was wired — while the surface gate certified it as enforced.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coordination-strangler

      # This job's gate is isolated by fixture pinning alone, which is the
      # mechanism FR-134 defect 3 defeated. The stubs are its second line.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      - name: Verify production inventory, ratchet, and per-workflow parity
        run: ./scripts/qa/test-coordination-strangler.sh
        env:
          PROTOC: /usr/bin/protoc

  governance:
    name: QA gate enforcement surface
    runs-on: ubuntu-latest
    steps:
      # Full history. test-agent-driver-production-parity.sh proves FR-126's
      # retirement evidence with `git cat-file`, `git merge-base` and a reverse
      # `git apply` of the removal patch — the parity record that has to hold
      # before a removal counts as closed. All three fail on the single commit
      # actions/checkout fetches by default, and all three pass on any developer
      # machine, so they had never once been verified in CI.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # test-docs-publishing-integrity.sh runs scripts/sync-docs.mjs to compare what
      # the generator produces against what the policy declares. Without Node the gate
      # exits on its own missing-command preamble rather than passing silently.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: governance

      # No ci-required gate may reach a real provider CLI. GitHub runners ship
      # neither binary today; these stubs turn a future accidental invocation
      # into a visible failure instead of silent credential and quota spend.
      # Extracted to a composite action so it is not one job's private
      # arrangement — coordination-strangler needs the same backstop.
      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      # Every step below reports independently. A serial job stops at its first
      # failure, so one red gate hides every diagnosis after it: FR-134's
      # workspace-scope defect sat invisible behind the ledger tooling's
      # self-lock for two runs. `continue-on-error` lets one run surface every
      # problem, and the aggregate step at the end is what fails the job.
      - name: Verify CI job liveness
        id: liveness
        continue-on-error: true
        run: ./scripts/qa/ci-liveness.rb

      - name: Verify CI job liveness negative fixtures
        id: liveness-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-ci-liveness.sh

      - name: Verify gate enforcement surface
        id: surface
        continue-on-error: true
        run: ./scripts/qa/test-qa-gate-surface.sh

      - name: Verify gate enforcement surface negative fixtures
        id: surface-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-qa-gate-surface.sh --fixture-test

      - name: Verify skill mirror integrity
        id: mirror
        continue-on-error: true
        run: ./scripts/qa/test-skill-mirror-integrity.sh

      - name: Verify skill mirror integrity negative fixtures
        id: mirror-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-skill-mirror-integrity.sh --fixture-test

      - name: Verify docs publishing integrity
        id: publishing
        continue-on-error: true
        run: ./scripts/qa/test-docs-publishing-integrity.sh

      - name: Verify docs publishing integrity negative fixtures
        id: publishing-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-docs-publishing-integrity.sh --fixture-test

      - name: Verify markdown link integrity
        id: links
        continue-on-error: true
        run: ./scripts/qa/test-markdown-link-integrity.sh

      - name: Verify markdown link integrity fixtures
        id: links-fixtures
        continue-on-error: true
        run: ./scripts/qa/test-markdown-link-integrity.sh --fixture-test

      - name: QA documentation lint and Agent driver documentation alignment
        id: doc-lint
        continue-on-error: true
        run: ./scripts/qa-doc-lint.sh

      - name: Coordination governance inventory
        id: coordination
        continue-on-error: true
        run: ./scripts/qa/test-coordination-governance.sh

      - name: Governance ledger regeneration tooling
        id: ledger-tooling
        continue-on-error: true
        run: ./scripts/qa/test-governance-ledger-tooling.sh

      - name: Core crate boundary and schema snapshot
        id: core-boundary
        continue-on-error: true
        run: ./scripts/qa/test-core-boundary.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Design doc and QA lifecycle metadata
        id: doc-lifecycle
        continue-on-error: true
        run: ./scripts/qa/test-doc-lifecycle.sh

      - name: Legacy coordination decommission contracts
        id: decommission
        continue-on-error: true
        run: ./scripts/qa/test-legacy-coordination-decommission.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Recorded Codex session resume contracts
        id: codex-resume
        continue-on-error: true
        run: ./scripts/qa/test-codex-session-resume.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Filesystem trigger contracts
        id: filesystem-trigger
        continue-on-error: true
        run: ./scripts/qa/test-filesystem-trigger.sh
        env:
          PROTOC: /usr/bin/protoc

      - name: Agent driver production parity
        id: parity
        continue-on-error: true
        run: ./scripts/qa/test-agent-driver-production-parity.sh
        env:
          PROTOC: /usr/bin/protoc

      # FR126_FAST=1 skips the repository-wide gates (fmt, clippy, workspace tests,
      # coordination strangler, coverage fixtures, qa-doc-lint) that already run as
      # sibling jobs in this workflow. The certifying aggregate is the workflow.
      - name: Agent driver execution migration contracts
        id: execution-migration
        continue-on-error: true
        run: FR126_FAST=1 ./scripts/qa/test-agent-driver-execution-migration.sh
        env:
          PROTOC: /usr/bin/protoc

      # This is the step that fails the job. Every gate above records its real
      # outcome and keeps going, so one run reports every problem instead of
      # only the first — which is how FR-134's workspace-scope defect stayed
      # invisible behind the ledger tooling's self-lock across two runs.
      - name: Governance result
        if: always()
        shell: bash
        env:
          OUTCOMES: |
            liveness=${{ steps.liveness.outcome }}
            liveness-fixtures=${{ steps.liveness-fixtures.outcome }}
            surface=${{ steps.surface.outcome }}
            surface-fixtures=${{ steps.surface-fixtures.outcome }}
            mirror=${{ steps.mirror.outcome }}
            mirror-fixtures=${{ steps.mirror-fixtures.outcome }}
            publishing=${{ steps.publishing.outcome }}
            publishing-fixtures=${{ steps.publishing-fixtures.outcome }}
            links=${{ steps.links.outcome }}
            links-fixtures=${{ steps.links-fixtures.outcome }}
            doc-lint=${{ steps.doc-lint.outcome }}
            coordination=${{ steps.coordination.outcome }}
            ledger-tooling=${{ steps.ledger-tooling.outcome }}
            core-boundary=${{ steps.core-boundary.outcome }}
            doc-lifecycle=${{ steps.doc-lifecycle.outcome }}
            decommission=${{ steps.decommission.outcome }}
            codex-resume=${{ steps.codex-resume.outcome }}
            filesystem-trigger=${{ steps.filesystem-trigger.outcome }}
            parity=${{ steps.parity.outcome }}
            execution-migration=${{ steps.execution-migration.outcome }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            gate="${line%%=*}"
            outcome="${line#*=}"
            printf '%-22s %s\n' "$gate" "$outcome"
            [[ "$outcome" == "success" || "$outcome" == "skipped" ]] || failed=1
          done <<< "$OUTCOMES"
          echo ""
          if [[ "$failed" -ne 0 ]]; then
            echo "one or more governance gates failed; each is reported above and in its own step" >&2
            exit 1
          fi
          echo "all governance gates passed"

  ci-environment-parity:
    name: CI environment parity
    runs-on: ubuntu-latest
    steps:
      # This job runs gates that are declared against other jobs, so it needs
      # what those gates need. ci-liveness.rb reads history; without it the
      # comparison still passes — both sides fail identically — but it would be
      # comparing two degraded runs and proving nothing about the real one.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby ripgrep sqlite3 protobuf-compiler

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install failing provider stubs
        uses: ./.github/actions/provider-stubs

      # Runs each in-scope gate twice, with and without the CI variables, so it
      # gets its own job rather than doubling the governance job's runtime.
      - name: Verify gates behave identically with and without CI set
        run: ./scripts/qa/test-ci-environment-parity.sh

      - name: Verify the comparison can fail
        run: ./scripts/qa/test-ci-environment-parity.sh --fixture-test

  coverage-policy-fixtures:
    name: Coverage policy fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify baseline, unsupported branch, and path fixtures
        run: ./scripts/coverage-governance.sh --fixture-test

  slack-certification-recorded:
    name: Slack certification recorded contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Both gates below require ripgrep, which neither runner image ships.
      # They had been exiting on their missing-command preamble on every push.
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Verify checkpoint, redaction, cleanup, and recorded provider contracts
        run: ./scripts/qa/test-slack-live-certification.sh

      - name: Display latest reviewed live status without loading secrets
        run: ./scripts/qa/certify-slack-managed-live.sh status

  boundary-coverage:
    name: Boundary coverage non-regression
    runs-on: macos-latest
    needs:
      - coverage-policy-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: boundary-coverage

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install Playwright browser
        working-directory: gui
        run: npx playwright install chromium

      - name: Generate and enforce boundary coverage
        run: ./scripts/coverage-governance.sh

      - name: Upload auditable coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boundary-coverage-${{ runner.os }}-${{ runner.arch }}
          path: target/coverage-governance/
          if-no-files-found: error

  miri:
    name: Miri unsafe validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: Run Miri on core crate (resource_limits module)
        run: cargo +nightly miri test -p agent-orchestrator --lib -- runner::resource_limits
        env:
          PROTOC: /usr/bin/protoc
          MIRIFLAGS: "-Zmiri-disable-isolation"

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross-compile tooling (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compile tooling (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Detect protoc path
        id: protoc
        shell: bash
        run: echo "path=$(which protoc)" >> "$GITHUB_OUTPUT"

      - name: Cargo check
        run: cargo check --workspace --exclude orchestrator-gui --target ${{ matrix.target }}
        env:
          PROTOC: ${{ steps.protoc.outputs.path }}
