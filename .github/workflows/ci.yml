name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  async-lock-governance:
    name: Async lock governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify async lock governance
        run: ./scripts/check-async-lock-governance.sh

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude orchestrator-gui --all-targets -- -D warnings
        env:
          PROTOC: /usr/bin/protoc

  test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --exclude orchestrator-gui
        env:
          PROTOC: /usr/bin/protoc

  coordination-strangler:
    name: Coordination strangler governance and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ruby sqlite3 protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coordination-strangler

      - name: Verify production inventory, ratchet, and per-workflow parity
        run: ./scripts/qa/test-coordination-strangler.sh
        env:
          PROTOC: /usr/bin/protoc

  coverage-policy-fixtures:
    name: Coverage policy fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify baseline, unsupported branch, and path fixtures
        run: ./scripts/coverage-governance.sh --fixture-test

  slack-certification-recorded:
    name: Slack certification recorded contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify checkpoint, redaction, cleanup, and recorded provider contracts
        run: ./scripts/qa/test-slack-live-certification.sh

      - name: Display latest reviewed live status without loading secrets
        run: ./scripts/qa/certify-slack-managed-live.sh status

  boundary-coverage:
    name: Boundary coverage non-regression
    runs-on: macos-latest
    needs:
      - coverage-policy-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: boundary-coverage

      - name: Install pinned cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Install Playwright browser
        working-directory: gui
        run: npx playwright install chromium

      - name: Generate and enforce boundary coverage
        run: ./scripts/coverage-governance.sh

      - name: Upload auditable coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boundary-coverage-${{ runner.os }}-${{ runner.arch }}
          path: target/coverage-governance/
          if-no-files-found: error

  miri:
    name: Miri unsafe validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: Run Miri on core crate (resource_limits module)
        run: cargo +nightly miri test -p agent-orchestrator --lib -- runner::resource_limits
        env:
          PROTOC: /usr/bin/protoc
          MIRIFLAGS: "-Zmiri-disable-isolation"

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cross-compile tooling (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install cross-compile tooling (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Detect protoc path
        id: protoc
        shell: bash
        run: echo "path=$(which protoc)" >> "$GITHUB_OUTPUT"

      - name: Cargo check
        run: cargo check --workspace --exclude orchestrator-gui --target ${{ matrix.target }}
        env:
          PROTOC: ${{ steps.protoc.outputs.path }}
