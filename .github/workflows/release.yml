name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  slack-certification-status:
    name: Display controlled Slack certification status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Report shared and dedicated evidence freshness
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Controlled Slack certification"
            echo
            echo '```text'
            ./scripts/qa/certify-slack-managed-live.sh status
            echo '```'
            echo
            echo "Expired evidence means recertification is required; it does not assert a product regression."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: slack-certification-status
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bin orchestrator --bin orchestratord

      - name: Package release archive
        run: scripts/package-release.sh "$RELEASE_TAG" "${{ matrix.target }}"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "orchestrator-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" > "orchestrator-${RELEASE_TAG}-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/orchestrator-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz
            dist/orchestrator-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz.sha256

  # FR-076 requirements 2-3. Deliberately not part of the `build` matrix: the
  # publish-surface gate derives the CLI/daemon shipped-target set from that
  # matrix's `target:` keys and cross-checks it against install.sh and the
  # Homebrew formula, and the GUI ships through neither of those channels. The
  # matrix key here is `label`, never `target`, so the derived set stays what
  # it claims to be.
  gui-build:
    name: Build GUI (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    needs: slack-certification-status
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: universal-apple-darwin
          - runner: ubuntu-latest
            label: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # The superset Tauri documents for AppImage/deb bundling, not only the
      # compile-time pair the ci.yml clippy/test jobs install: appimagetool
      # walks the runtime link graph, so bundling needs what compiling does not.
      - name: Install GUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          build-essential curl wget file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.label }}

      - name: Install frontend dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - working-directory: gui
        name: npm ci
        run: npm ci

      # Signing engages only when the credentials exist as repository secrets
      # (FR-076 requirement 4). An empty APPLE_CERTIFICATE must not reach the
      # Tauri CLI: it treats presence as intent and would fail the import
      # rather than skip it. Without credentials the .dmg ships unsigned and
      # the release notes carry the xattr recipe.
      - name: Enable macOS signing when credentials exist
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$APPLE_CERTIFICATE_SECRET" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
            } >> "$GITHUB_ENV"
            echo "code signing enabled"
          else
            echo "no signing certificate configured — the .dmg ships unsigned"
          fi
          if [[ -n "$APPLE_ID_SECRET" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo "notarization enabled"
          else
            echo "no notarization credentials configured — skipping notarization"
          fi

      - name: Build GUI bundles (macOS)
        if: runner.os == 'macOS'
        working-directory: crates/gui
        run: ../../gui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg

      - name: Build GUI bundles (Linux)
        if: runner.os == 'Linux'
        working-directory: crates/gui
        run: ../../gui/node_modules/.bin/tauri build --bundles appimage,deb

      - name: Stage GUI assets under the release naming scheme
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.label }}" in
            universal-apple-darwin)
              bundle_dir="target/universal-apple-darwin/release/bundle"
              dmg=$(find "$bundle_dir/dmg" -name '*.dmg' -print -quit)
              [[ -n "$dmg" ]] || { echo "no .dmg produced under $bundle_dir" >&2; exit 1; }
              cp "$dmg" "dist/orchestrator-gui-${RELEASE_TAG}-universal-apple-darwin.dmg"
              ;;
            x86_64-unknown-linux-gnu)
              bundle_dir="target/release/bundle"
              appimage=$(find "$bundle_dir/appimage" -name '*.AppImage' -print -quit)
              deb=$(find "$bundle_dir/deb" -name '*.deb' -print -quit)
              [[ -n "$appimage" && -n "$deb" ]] || { echo "missing .AppImage or .deb under $bundle_dir" >&2; exit 1; }
              cp "$appimage" "dist/orchestrator-gui-${RELEASE_TAG}-x86_64-unknown-linux-gnu.AppImage"
              cp "$deb" "dist/orchestrator-gui-${RELEASE_TAG}-x86_64-unknown-linux-gnu.deb"
              ;;
          esac
          cd dist
          for f in orchestrator-gui-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - name: Upload GUI assets
        uses: actions/upload-artifact@v7
        with:
          name: release-gui-${{ matrix.label }}
          path: dist/orchestrator-gui-*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - gui-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Package skills
        run: scripts/package-skills.sh "$RELEASE_TAG"

      - name: Build checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 > "dist/orchestrator-${RELEASE_TAG}-sha256sums.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*sha256*

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate formula
        run: scripts/update-homebrew-formula.sh "$RELEASE_TAG" > "${{ github.workspace }}/orchestrator.rb"

      # Inline push instead of a third-party action: the previous
      # dmnemec/copy_file_to_another_repo_action@main was the only non-tag-pinned
      # action in the tree and it received TAP_GITHUB_TOKEN. `gh` + git are
      # preinstalled on the runner and every command below is auditable in place.
      - name: Push to Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone c9r-io/homebrew-tap tap -- --depth 1
          mkdir -p tap/Formula
          cp orchestrator.rb tap/Formula/orchestrator.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/orchestrator.rb
          if git diff --cached --quiet; then
            echo "formula unchanged — nothing to push"
            exit 0
          fi
          git commit -m "orchestrator ${RELEASE_TAG}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/c9r-io/homebrew-tap.git"
          git push origin HEAD

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      id-token: write
      contents: read
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Obtain crates.io publish token (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in \
            crates/proto \
            crates/orchestrator-config \
            crates/orchestrator-collab \
            crates/orchestrator-security \
            crates/orchestrator-runner \
            crates/orchestrator-persistence \
            core \
            crates/orchestrator-scheduler \
            crates/orchestrator-client \
            crates/cli \
            crates/slack-gateway \
            crates/daemon; do
            echo "::group::Publishing ${crate}"
            cargo publish --manifest-path "${crate}/Cargo.toml" 2>&1 | tee /tmp/publish.log || {
              # Tolerate the already-published case for idempotent retries.
              # cargo's client-side pre-check says "already exists on crates.io index";
              # the server-side rejection says "is already uploaded" — match both.
              if grep -qE "already exists|already uploaded" /tmp/publish.log; then
                echo "⚠ Already published — skipping"
              else
                exit 1
              fi
            }
            echo "::endgroup::"
            # crates.io index needs time to propagate
            sleep 30
          done
