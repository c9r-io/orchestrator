name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/guide/**'
      - 'docs/showcases/**'
      - 'scripts/sync-docs.mjs'
      - 'config/governance/docs-publishing.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The publishing gate below reads config/governance/docs-publishing.json with
      # jq. Installed rather than assumed, so a runner image change fails the step
      # instead of the gate.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Verify docs publishing integrity
        run: ./scripts/qa/test-docs-publishing-integrity.sh

      - name: Sync docs to site
        run: node scripts/sync-docs.mjs

      - name: Build
        working-directory: site
        run: npx vitepress build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/.vitepress/dist --project-name=orchestrator-docs
